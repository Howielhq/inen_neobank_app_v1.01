<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INEN 盈安 · App 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E9E9E7;
  --bg:#0B0B0C; --bg2:#131315; --surface:#18181B; --surface2:#222226;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#F6F5F3; --ink2:#A1A1A8; --ink3:#6E6E76;
  --gold:#F6F5F3; --gold2:#D9D9DC; --goldInk:#0B0B0C;
  --up:#2FB36B; --down:#E5605A; --tab:rgba(24,24,27,.9);
  --btn:#F6F5F3; --btnInk:#0B0B0C;
  --silk:.45; --st:50px;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--page);font-family:Inter,"Noto Sans SC",-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.app[data-theme="light"]{
  --bg:#FFFFFF; --bg2:#F6F5F3; --surface:#FFFFFF; --surface2:#F6F5F3;
  --line:#ECEBE8; --line2:rgba(11,11,12,.12);
  --ink:#0B0B0C; --ink2:#5E5E63; --ink3:#9A9AA0;
  --gold:#0B0B0C; --gold2:#2A2A2E; --goldInk:#FFFFFF;
  --up:#1E9E5A; --down:#D64545; --tab:rgba(255,255,255,.92);
  --btn:#0B0B0C; --btnInk:#FFFFFF;
  --silk:.22;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0A0A0B}}
:root[data-theme="dark"]{--page:#0A0A0B}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 40px}
.toolbar{display:flex;align-items:center;gap:12px;font-size:13px;color:#5E5E63;flex-wrap:wrap;justify-content:center}
:root[data-theme="dark"] .toolbar{color:#8E8E95}
.seg-mini{display:inline-flex;background:rgba(0,0,0,.06);border-radius:12px;padding:3px}
:root[data-theme="dark"] .seg-mini{background:rgba(255,255,255,.08)}
.seg-mini button{border:0;background:transparent;font-size:13px;padding:6px 14px;border-radius:9px;color:inherit;cursor:pointer}
.seg-mini button[aria-pressed="true"]{background:#fff;color:#0B0B0C;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.phone{width:390px;max-width:100%;height:844px;border-radius:48px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #141416,0 0 0 11px #2C2C31,0 40px 80px rgba(0,0,0,.35)}
.app{position:relative;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;transition:background .3s}
.silk{position:absolute;inset:0 0 auto 0;height:620px;pointer-events:none;opacity:var(--silk);
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.status{position:absolute;top:0;left:0;right:0;height:50px;z-index:70;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 6px;font-weight:600;font-size:15px;color:var(--ink)}
.status .ind{display:flex;gap:6px;align-items:center}
.status .batt{width:25px;height:12px;border-radius:4px;border:1.5px solid currentColor;opacity:.9;position:relative}
.status .batt::after{content:"";position:absolute;inset:1.5px;right:6px;background:currentColor;border-radius:2px}

.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:var(--st) 0 120px;scrollbar-width:none}
.view::-webkit-scrollbar,.pc::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.view[hidden]{display:none}

/* home */
.top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0}
.avatar{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);cursor:pointer}
.round{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);cursor:pointer;padding:0}
.bal{position:relative;text-align:center;margin-top:34px}
.bal-label{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);background:transparent;border:0;cursor:pointer;padding:4px 6px}
.flags{display:flex}
.flags span{width:18px;height:18px;border-radius:50%;margin-left:-6px;border:1.5px solid var(--bg);display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.flags span:first-child{margin-left:0}
.amount{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:6px;padding-left:46px}
.amount .num{font-size:50px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.amount .num small{font-size:50px;color:var(--ink3);font-weight:700}
.eye{margin-top:4px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line2);color:var(--ink2);cursor:pointer;padding:0}
.spend{margin:16px auto 0;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);font-size:13px;color:var(--ink2);cursor:pointer}
.spend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.spend .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.actions{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:28px 22px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer}
.act i{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:var(--btn);color:var(--btnInk);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.act:first-child i{background:linear-gradient(145deg,var(--gold),var(--gold2));color:var(--goldInk)}
.promo{position:relative;margin:22px 18px 0;padding:16px 16px 16px 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px;overflow:hidden;cursor:pointer}
.promo h4{margin:0;font-size:15px;font-weight:700}
.promo p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--ink2)}
.mini-cards{margin-left:auto;position:relative;width:86px;height:56px;flex:none}
.mini-cards div{position:absolute;width:62px;height:40px;border-radius:7px}
.mini-cards div:nth-child(1){right:0;top:0;background:linear-gradient(135deg,#CBB08A,#8A6A3F);transform:rotate(8deg)}
.mini-cards div:nth-child(2){left:0;bottom:0;background:linear-gradient(135deg,#26262A,#0B0B0C);border:1px solid rgba(176,138,87,.4);transform:rotate(-6deg)}
.close{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink2);cursor:pointer;display:grid;place-items:center;padding:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:28px 22px 12px}
.sec-h h3{margin:0;font-size:17px;font-weight:700}
.sec-h button{font-size:13px;color:var(--ink2);background:none;border:0;cursor:pointer;padding:0}
.accts{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.accts::-webkit-scrollbar{display:none}
.acct{flex:none;width:158px;scroll-snap-align:start;border-radius:22px;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:22px;text-align:left;color:inherit;cursor:pointer}
.acct .h{display:flex;align-items:center;gap:10px}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.coin.flag-us{overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px rgba(11,11,12,.08);padding:0}.coin.flag-us svg{display:block}
.acct .h b{display:block;font-size:14px;font-weight:600}
.acct .h span{font-size:12px;color:var(--ink3)}
.acct .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.acct .f{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px 0}
.tile{border-radius:22px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:inherit;text-align:left}
.tile .t{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldInk)}
.tile .v{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.card-wrap{padding:0 18px;position:relative}
.card-wrap::after{content:"";position:absolute;left:36px;right:36px;bottom:-8px;height:20px;border-radius:0 0 20px 20px;background:var(--surface2);z-index:0}
.vcard{position:relative;z-index:1;aspect-ratio:1.586;border-radius:24px;overflow:hidden;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;color:#F6F5F3;cursor:pointer;
  background:radial-gradient(120% 90% at 85% 10%,#2E2E33 0%,#151517 45%,#0B0B0C 100%);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.vcard svg.lines{position:absolute;inset:0;width:100%;height:100%}
.vcard .row{position:relative;display:flex;justify-content:space-between;align-items:center}
.vcard.frozen{filter:grayscale(1) brightness(.75)}
.vcard .frz{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px;z-index:2;background:rgba(11,11,12,.35);letter-spacing:.1em}
.brand{font-weight:800;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand em{font-style:normal;font-weight:500;font-size:13px;color:#B4B4BA}
.chip{font-size:11px;padding:3px 8px;border-radius:8px;background:rgba(246,245,243,.12);border:1px solid rgba(246,245,243,.18);color:#E7E7E5}
.vcard .bal2 b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.vcard .bal2 span{display:block;font-size:12px;color:#A1A1A8;margin-bottom:2px}
.pan{font-size:15px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.visa{font-weight:800;font-style:italic;font-size:20px;letter-spacing:-.02em}
.card-cta{display:flex;gap:10px;padding:22px 18px 0}
.card-cta button{flex:1;height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.setup{margin:22px 18px 0;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.setup h4{margin:0;font-size:15px;font-weight:700}
.setup p{margin:4px 0 10px;font-size:13px;color:var(--ink2);line-height:1.5}
.setup .sbtn{border:0;background:var(--btn);color:var(--btnInk);font-size:13px;font-weight:600;padding:8px 14px;border-radius:12px;cursor:pointer}
.ring{margin-left:auto;flex:none;position:relative;width:64px;height:64px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700}
.tx{margin:0 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:4px 16px}
.txr{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.txr+.txr{border-top:1px solid var(--line)}
.txr .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--surface2)}
.txr .m{flex:1;min-width:0}
.txr .m b{display:block;font-size:15px;font-weight:600}
.txr .m span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.txr .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.txr .r b{display:block;font-size:15px;font-weight:600}
.txr .r span{font-size:12px;color:var(--ink3)}
.pos{color:var(--up)} .neg{color:var(--down)}
.masked{filter:blur(9px);transition:filter .2s}

/* tab bar */
.tabbar{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:70px;border-radius:26px;background:var(--tab);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:10}
.tabbar button{border:0;background:transparent;color:var(--ink3);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:18px;cursor:pointer;padding:0}
.tabbar button[aria-current="page"]{background:var(--surface2);color:var(--ink)}
.tabbar .ico{position:relative;display:grid;place-items:center}
.badge{position:absolute;top:-7px;left:14px;min-width:24px;height:16px;padding:0 5px;border-radius:8px;font-size:10px;font-weight:700;line-height:16px;text-align:center;color:var(--goldInk);background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 0 0 2px var(--tab)}

/* tab headers */
.vh{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px}
.vh h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}

/* pages */
.page{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.page.in{transform:none}
.ph{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(var(--st) + 8px) 16px 6px}
.ph h2{margin:0;text-align:center;font-size:17px;font-weight:700}
.ph>div{display:flex;justify-content:flex-end}
.pc{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 18px 28px;scrollbar-width:none}
.pf{flex:none;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 6px;line-height:1.25}
.lead{color:var(--ink2);font-size:14px;margin:0 4px 18px;line-height:1.55}
.lbl{font-size:13px;color:var(--ink3);margin:22px 6px 8px}
.note{font-size:12.5px;color:var(--ink3);line-height:1.6;margin:14px 6px 0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font-size:15px}
.item+.item{border-top:1px solid var(--line)}
.ii{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);flex:none;color:var(--ink)}
.it{flex:1;min-width:0}
.it b{display:block;font-size:15px;font-weight:600}
.it span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.it span.chips{display:flex;margin-top:7px}
.it span.pill{display:inline-block;margin-top:0;font-size:11.5px;color:var(--ink2);line-height:1.4}
.it span.pill.ok{color:var(--up)}
.ir{color:var(--ink3);display:flex;align-items:center;gap:8px;font-size:13px;flex:none}
.pill{font-size:11.5px;padding:3px 8px;border-radius:8px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:rgba(47,179,107,.14);color:var(--up)}
.pill.warn{background:rgba(229,96,90,.14);color:var(--down)}
.pill.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldInk);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.btn{width:100%;height:54px;border-radius:18px;border:0;background:var(--btn);color:var(--btnInk);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldInk)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btns{display:flex;gap:10px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--ink2);margin:0 4px 7px}
.input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:0 16px;outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--gold)}
.input[readonly]{background:var(--surface2)}
.inwrap{position:relative}
.inwrap .input{padding-right:84px}
.inwrap .inbtn{position:absolute;right:8px;top:8px;height:36px;padding:0 12px;border-radius:12px;border:0;background:var(--surface2);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.seg{display:flex;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:14px;font-weight:600;padding:9px 6px;border-radius:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.switch{width:50px;height:30px;border-radius:15px;background:var(--surface2);border:1px solid var(--line2);position:relative;cursor:pointer;flex:none;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink3);transition:left .2s,background .2s}
.switch[aria-checked="true"]{background:var(--gold);border-color:transparent}
.switch[aria-checked="true"]::after{left:23px;background:#fff}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--ink3);flex:none}
.kv b{font-weight:600;text-align:right;word-break:break-all}
.copyrow{display:flex;align-items:center;gap:12px;padding:13px 16px}
.copyrow+.copyrow{border-top:1px solid var(--line)}
.copyrow div{flex:1;min-width:0}
.copyrow small{display:block;font-size:12.5px;color:var(--ink3)}
.copyrow b{display:block;font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;word-break:break-all}
.cbtn{width:36px;height:36px;border-radius:12px;border:0;background:var(--surface2);color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.search{position:relative;margin-bottom:6px}
.search svg{position:absolute;left:14px;top:16px;color:var(--ink3)}
.search .input{padding-left:42px}
.flag{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface2);flex:none}

/* amount */
.pair{display:flex;align-items:center;gap:8px}
.acc-chip{flex:1;min-width:0;display:flex;gap:9px;align-items:center;padding:10px 11px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);color:inherit;text-align:left}
button.acc-chip{cursor:pointer}
.acc-chip b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-chip small{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.acc-chip span{min-width:0}
.pair-arrow{color:var(--ink3);flex:none}
.amt-big{text-align:center;font-size:54px;font-weight:700;letter-spacing:-.035em;margin-top:34px;font-variant-numeric:tabular-nums;min-height:64px;white-space:nowrap;overflow:hidden}
.amt-big.zero{color:var(--ink3)}
.amt-sub{text-align:center;font-size:13px;color:var(--ink2);margin-top:8px;min-height:40px;line-height:1.55;padding:0 10px}
.pcts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pcts button{height:42px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px}
.key{height:58px;border:0;background:none;color:var(--ink);font-size:26px;font-weight:500;cursor:pointer;border-radius:16px;display:grid;place-items:center}
.key:active{background:var(--surface)}

/* ---- soft material & pill tab bar (ref: Iconly) ---- */
.app{--card:linear-gradient(180deg,#FFFFFF 0%,#FAFAF9 100%);--card-bd:rgba(255,255,255,.95);
  --card-sh:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(11,11,12,.04),0 10px 26px -14px rgba(11,11,12,.16);
  --raise:linear-gradient(180deg,#FFFFFF,#F6F6F5);--raise-sh:0 1px 2px rgba(11,11,12,.06),0 8px 18px -8px rgba(11,11,12,.18);
  --pill:linear-gradient(180deg,#F3F3F2 0%,#EAEAE8 100%);--pill-sh:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(11,11,12,.03),0 14px 30px -14px rgba(11,11,12,.25);
  background:var(--bg)}
.app[data-theme="dark"]{--card:linear-gradient(180deg,#1D1D21 0%,#17171A 100%);--card-bd:rgba(255,255,255,.06);
  --card-sh:inset 0 1px 0 rgba(255,255,255,.05),0 12px 28px -16px rgba(0,0,0,.7);
  --raise:linear-gradient(180deg,#26262B,#1C1C20);--raise-sh:inset 0 1px 0 rgba(255,255,255,.06),0 8px 18px -8px rgba(0,0,0,.6);
  --pill:linear-gradient(180deg,#1F1F23 0%,#17171A 100%);--pill-sh:inset 0 1px 0 rgba(255,255,255,.06),0 14px 30px -12px rgba(0,0,0,.75);
  background:var(--bg)}
.page{background:var(--bg)}
.app[data-theme="light"] .silk{display:none}
.app .group,.app .acct,.app .promo:not(.earn-ban),.app .setup,.app .tx,.app .vi-i,.app .radl,.app .terms,.app .cv-card,.app .xf-card,.app .xf-amt,.app .agrid,.app .asum,.app .aban,.app .revw,.app .rs-g,.app .pl-i,.app .tf-key,.app .rc,.app .cv-fee,.app .cv-rate{
  background:var(--card);border-color:var(--card-bd);box-shadow:var(--card-sh)}
.app .agrid{background:var(--line)}.app .agrid div{background:transparent}
.app .card-cta button,.app .fchips button:not([aria-pressed="true"]),.app .achips button:not([aria-pressed="true"]),.app .rsnd,.app .rs-n button{background:var(--raise);border-color:var(--card-bd);box-shadow:var(--raise-sh)}

/* tab bar */
.tabbar{display:flex;align-items:center;gap:10px;height:66px;left:14px;right:14px;padding:0;background:none;border:0;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;grid-template-columns:none}
.tb-pill{flex:1;min-width:0;height:66px;display:flex;align-items:center;gap:2px;padding:6px;border-radius:33px;background:var(--pill);box-shadow:var(--pill-sh);border:1px solid var(--card-bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tabbar .tb-pill button{flex:1 1 0;min-width:0;height:54px;flex-direction:row;gap:8px;border-radius:27px;color:var(--ink);font-size:14px;font-weight:600;transition:flex-grow .25s ease,background .2s}
.tabbar .tb-pill button .tbl{display:none;white-space:nowrap}
.tabbar .tb-pill button[aria-current="page"]{flex-grow:2.1;background:var(--raise);box-shadow:var(--raise-sh)}
.tabbar .tb-pill button[aria-current="page"] .tbl{display:inline}
.tabbar .tb-pill button[aria-current="page"] svg{stroke-width:2.6}
.tabbar .tb-pill button:not([aria-current="page"]){color:var(--ink2)}
.tabbar .tb-fab{flex:none;width:66px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--btn);color:var(--btnInk);box-shadow:0 16px 30px -12px rgba(11,11,12,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.tabbar .tb-fab:active{transform:scale(.96)}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;border:1px solid var(--card-bd);background:var(--card);box-shadow:var(--card-sh);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.qa i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--btnInk)}
.qa b{font-size:15px}.qa span{font-size:12px;color:var(--ink3);margin-top:-6px}
html[lang="en"] .tabbar .tb-pill button{font-size:13px}
/* ---- monochrome look (ref) ---- */
.act i{border-radius:50%;background:#F0F0F0;color:#0B0B0C;box-shadow:none}

.app[data-theme="light"] .tb-pill{background:#FFFFFF;border-color:rgba(11,11,12,.04);box-shadow:0 10px 30px -10px rgba(11,11,12,.18),0 1px 3px rgba(11,11,12,.06)}

/* ===== World Money–inspired skin (design only) ===== */
.app[data-theme="light"]{
  --bg:#F9F9F8; --bg2:#F3F2F0; --surface:#FFFFFF; --surface2:#F3F2F0;
  --line:#EDECE9; --line2:#E1DFDA;
  --ink:#181818; --ink2:#75726F; --ink3:#8A8782;
  --gold:#B08A57; --gold2:#8A6A3F; --goldInk:#FFFFFF;
  --up:#2EAA55; --down:#E5484D; --tab:rgba(255,255,255,.94);
  --btn:#181818; --btnInk:#FFFFFF;
  --card:#FFFFFF; --card-bd:rgba(24,24,24,.04);
  --card-sh:0 1px 2px rgba(24,24,24,.04),0 4px 12px rgba(24,24,24,.04);
  --raise:#FFFFFF; --raise-sh:0 1px 2px rgba(24,24,24,.05),0 6px 16px rgba(24,24,24,.06);
  --pill:#FFFFFF; --pill-sh:inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(24,24,24,.04),0 16px 48px rgba(24,24,24,.10);
  --chip:#F3F2F0; --pressed:#EDECE9; --brandSoft:#F5EEE3;
}
.app[data-theme="dark"]{
  --bg:#121211; --bg2:#1C1C1B; --surface:#1C1C1B; --surface2:#262625;
  --line:#262625; --line2:#373635;
  --ink:#F3F2F0; --ink2:#9D9B96; --ink3:#75726F;
  --gold:#C9A574; --gold2:#B08A57; --goldInk:#181818;
  --up:#3DBE5C; --down:#E5605A; --tab:rgba(28,28,27,.94);
  --btn:#F3F2F0; --btnInk:#181818;
  --card:#1C1C1B; --card-bd:rgba(255,255,255,.05);
  --card-sh:0 8px 24px -12px rgba(0,0,0,.6);
  --raise:#262625; --raise-sh:0 6px 16px -6px rgba(0,0,0,.6);
  --pill:#1C1C1B; --pill-sh:inset 0 1px 0 rgba(255,255,255,.06),0 16px 48px rgba(0,0,0,.6);
  --chip:#262625; --pressed:#2D2C2C; --brandSoft:#2A241C;
}
.app,.app button,.app input,.app select,.app textarea{font-family:"Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1}
/* typography: one big number per screen, calmer weights */
.app .amount .num,.app .amount .num small{font-weight:600;letter-spacing:-.025em}
.app .amount .num{font-size:46px}.app .amount .num small{font-size:46px}
.app .h1,.app .ob-h{font-weight:600;letter-spacing:-.02em}
.app .acct .v,.app .hv{font-weight:600;letter-spacing:-.02em}
.app .lbl{font-weight:600;color:var(--ink);font-size:15px}
.app .bal-label{color:var(--ink2)}
/* data colours: up = green, down = grey (calm finance); errors stay red */
.app .chg.dn,.app .neg{color:var(--ink3)}
/* buttons: black is the CTA colour, everything clickable is a pill */
.app .btn{border-radius:999px;font-weight:600}
.app .btn.gold{background:var(--btn);color:var(--btnInk)}
.app .btn.ghost,.app .btn.lite{background:var(--chip);color:var(--ink);border-color:transparent;box-shadow:none}
.app .sbtn{border-radius:999px;background:var(--btn);color:var(--btnInk)}
.app .pill.gold{background:var(--brandSoft);color:var(--gold2)}
.app[data-theme="dark"] .pill.gold{color:var(--gold)}
/* quick actions: 1 black primary + grey circles */
.app .actions .act i{width:52px;height:52px;border-radius:50%;background:var(--chip);color:var(--ink);box-shadow:none}
.app .actions .act:first-child i{background:var(--btn);color:var(--btnInk)}

function coin(k,s=34){if(k==='USD')return usFlag(s);if(COINIMG[k])return coinImg(k,s);const a=ACC[k];const inner=ICON[a.sym]?ic(a.sym,s*.5,2.2):a.sym;return `<span class="coin" style="background:${a.color};width:${s}px;height:${s}px;font-size:${s*.4}px">${inner}</span>`}
function item({icon,iconHtml,title,sub,right,attrs='',chips}){

const sw=(k,label)=>`<button class="switch" role="switch" aria-checked="${!!S.sw[k]}" aria-label="${label||''}" data-sw="${k}"></button>`;

  return `<span class="ic">${ic(t.icon,20,1.9)}</span>`}
function txView(t){const parts=String(t.sub||'').split(' · ');const row=k=>((t.rows||[]).find(r=>r[0]===k)||[])[1];
  if(t.title==='已发送'){const kind=t.icon==='bank'?'银行转出':t.icon==='at'?'盈安用户转账':'链上转账';const ch=t.icon==='bank'?(row('汇款方式')||row('通道')||''):t.icon==='at'?'':parts.slice(1).join(' · ');return {title:parts[0],sub:kind+(ch?' · '+ch:'')}}
  if(t.title==='已收到')return {title:parts[0],sub:'链上收款'+(parts[1]?' · '+parts[1]:'')};
  if(t.title==='银行入账'){const pyr=(row('付款人')||row('付款方')||'').replace(/\s*•+\d+$/,'');return {title:pyr||'银行转入',sub:'银行转入 · '+(row('入账方式')||parts[0])}}

function qrSvg(seed){
  let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const N=25;let r='';
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" width="100%" height="100%" fill="#0B0B0C" shape-rendering="crispEdges">${r}${f(0,0)}${f(N-7,0)}${f(0,N-7)}</svg>`;
}

function feeOf(p,v){
  if(p.mode!=='send')return 0;
  if(p.kind==='bank')return RAIL_FEE[p.rail]||0;
  if(p.kind==='chain')return (NETS[p.from].find(n=>n.n===p.net)||{fee:1}).fee;
  return 0;
}
function recvOf(p,v){
  if(p.mode==='convert')return fl2(v*fxRate(p.from,p.to));
  if(p.mode==='send'&&p.kind==='bank')return v*RATES[p.ccy];
  if(p.mode==='fixed')return toUT(ACC[p.from].cur,v);
  if(p.mode==='transfer'&&p.to==='EARN')return toUT(ACC[p.from].cur,v);
  if(p.mode==='transfer'&&p.to==='CARD'&&ACC[p.from].cur!=='USD')return fl2(v*fxRate(ACC[p.from].cur,'USD'));
  if(p.mode==='transfer'&&p.from==='CARD'&&ACC[p.to].cur!=='USD')return fl2(v*fxRate('USD',ACC[p.to].cur));
  if(p.mode==='transfer'&&p.from==='EARN'&&ACC[p.to].cur!=='USDT')return fl2(v*fxRate('USDT',ACC[p.to].cur));
  return v;
}

  r.push([p.mode==='send'?(p.kind==='bank'&&p.rail==='SWIFT'?'收款人到账金额（未扣中间行费用）':'收款人到账金额'):'到账金额',money(recvOf(p,p.amt),tc)]);
  {const h=p.mode==='send'&&p.kind==='bank'?bankHold():null;r.push(['预计到账',etaOf(p)+(h?`<small class="hol-n">${h.why}，将于 ${h.next} 开始处理</small>`:'')])}

function execute(p){
  const fc=ACC[p.from].cur,tc=toCur(p),recv=recvOf(p,p.amt);
  S.bal[p.from]=Math.round((S.bal[p.from]-p.amt-p.fee)*100)/100;
  const t={id:Date.now(),time:'刚刚',amt:-p.amt,cur:fc,recv,rows:confirmRows(p).filter(r=>r[0]!=='付款账户')};
  if(p.mode==='fixed'){const f=FT.find(x=>x.id===p.pid);S.fixed.push({id:t.id,pid:f.id,amt:recv,src:p.from,start:TODAY,end:addD(TODAY,f.days),int:r2(ftInt(f,recv)),renew:!!p.renew});
    Object.assign(t,{type:'swap',status:'计息中',icon:'lock',title:`申购 USDT 定期 ${f.days} 天`,sub:`从${ACC[p.from].name} · 参考年化 ${f.apy.toFixed(2)}%`,earn:true,accs:[p.from,'EARN']});S.tx.unshift(t);refresh();return t}
  if(p.mode==='send'){Object.assign(t,{type:'out',icon:p.kind==='bank'?'bank':p.kind==='chain'?p.from:'at',title:'已发送',sub:`${p.name} · ${p.sub}`,status:p.kind==='inen'?'已完成':'处理中'});
    if(p.kind==='bank'){t.rows=t.rows.map(r=>r[0]==='收款人'?['收款人',esc(p.name)]:r);const i=t.rows.findIndex(r=>r[0]==='收款人')+1;t.rows.splice(i,0,['收款银行',esc(p.bank||'—')],['收款账号',`${p.ccy} ••••${p.acct||String(p.sub).slice(-4)}`]);if(p.ref){t.ref=p.ref;t.rows.push(['汇款附言',`<span data-noi18n>${esc(p.ref)}</span>`])}if(p.notify){t.notify=p.notify;t.rows.push(['通知收款人',`<span data-noi18n style="color:var(--ink)">${esc(p.notify)}</span>`])}}
    if(p.kind==='chain'){t.rows=t.rows.filter(r=>r[0]!=='收款人').map(r=>r[0]==='手续费'?['网络费',r[1]]:r[0]==='收款人到账金额'?['预计到账数量',r[1]]:r);t.rows.unshift(['收款地址',`<span class="mono">${esc(p.addr||p.sub)}</span>`],['转账网络',p.net]);
      setTimeout(()=>{t.status='已完成';t.time='今天 '+new Date().toTimeString().slice(0,5);refresh()},30000)}}
  else{
    S.bal[p.to]=Math.round((S.bal[p.to]+recv)*100)/100;
    Object.assign(t,{type:'swap',status:'已完成'});
    if(p.mode==='convert')Object.assign(t,{icon:'swap',title:`兑换 ${fc} → ${tc}`,sub:`到账 ${money(recv,tc)}`});
    else Object.assign(t,{icon:'move',title:`划转至${ACC[p.to].name}`,sub:`从${ACC[p.from].name}`,earn:p.from==='EARN'||p.to==='EARN',card:p.from==='CARD'||p.to==='CARD'});
  }
  if(p.mode==='transfer'&&p.to==='EARN')S.earnSrc[p.from]=r2(S.earnSrc[p.from]+recv);
  if(p.mode==='transfer'&&p.from==='EARN'){const sp=earnSplit(p.to,p.amt);S.earnSrc[p.to]=r2(S.earnSrc[p.to]-sp.free);let rest=sp.cross;
    const others=['USD','USDT','USDC'].filter(k=>k!==p.to&&S.earnSrc[k]>0);const tot=others.reduce((a,k)=>a+S.earnSrc[k],0);
    others.forEach((k,i)=>{const take=i===others.length-1?rest:r2(sp.cross*S.earnSrc[k]/tot);S.earnSrc[k]=Math.max(0,r2(S.earnSrc[k]-take));rest=r2(rest-take)})}
  t.accs=p.mode==='send'?[p.from]:[p.from,p.to];
  S.tx.unshift(t);refresh();return t;
}

const nowT=()=>{const d=new Date();return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
function fillOrder(o,px){const pr=PR[o.code];const value=o.qty*pr.size*px;T.volume=(T.volume||0)+value;
  if(pr.type==='spot'){const fee=value*pr.feeRate;
    if(o.side==='buy'){T.hold[o.code]=+(T.hold[o.code]+o.qty).toFixed(3);T.cost[o.code]+=value+fee;S.bal.TRADE=r2(S.bal.TRADE-value-fee);T.fills.unshift({code:o.code,act:'买入',qty:o.qty,price:px,value,fee,time:nowT()})}
    else{const avg=T.cost[o.code]/T.hold[o.code];const pnl=value-fee-avg*o.qty;T.cost[o.code]-=avg*o.qty;T.hold[o.code]=+(T.hold[o.code]-o.qty).toFixed(3);if(T.hold[o.code]<=0){T.hold[o.code]=0;T.cost[o.code]=0}S.bal.TRADE=r2(S.bal.TRADE+value-fee);T.fills.unshift({code:o.code,act:'卖出',qty:o.qty,price:px,pnl,time:nowT()})}
  }else{const fee=pr.type==='fut'?pr.fee*o.qty:0;S.bal.TRADE=r2(S.bal.TRADE-fee);
    T.pos.push({id:Date.now()+Math.random(),code:o.code,side:o.side,qty:o.qty,open:px,sl:o.sl,tp:o.tp});

}

  else if(M.passkey.length)passkeyAuth(next);else next()}

  push('lgCode',{icon:'chat',h:'验证新设备',lead:'首次在此设备登录，需验证短信。验证码已发送至',dest:ph,kind:'phone',alt:'无法接收短信？',onAlt:lgSmsHelp,done:()=>lg2fa(()=>lgFinish(ctx,true))})}
function lgFinish(ctx,newDev){setTimeout(()=>{if(S.consent&&S.consent.v!==TERMS_V&&!S.termsDeclined)reConsent()},ctx.from==='logout'?1600:600);if(newDev)S.newDev=true;if(ctx.from==='logout')S.loginLog.unshift({dev:CUR_DEV,at:dtNow(),loc:MY_LOC,ip:MY_IP,how:newDev?'密码 + 短信':'密码'});LG().fails=0;LG().lockUntil=0;
  if(ctx.pending){clearPending();resumeKyc(ctx.pending);return}
  if(ctx.from==='logout'){S.lastAcct=null;closeSheet(true);popAll();S.tab='home';refresh();setTimeout(()=>{toast(`欢迎回来，${S.user.name||'Sanfeng'}`);if(newDev)setTimeout(lgNotice,900)},380);return}
  try{sessionStorage.setItem('inen-login',JSON.stringify({nd:!!newDev,hold:S._lgHold||0}))}catch(e){}
  const o=document.createElement('div');o.className='lg-load';o.innerHTML=`<span class="lg-sp"></span><b>正在登录…</b>`;app.appendChild(o);setTimeout(()=>location.reload(),700)}

     <label class="pin2"><input id="lpw" type="password" placeholder="登录密码" autocomplete="current-password" aria-label="登录密码"><button type="button" class="lg-eye" id="lgEye" aria-label="显示密码">${ic('eye',20,2)}</button></label><p class="ob-err" id="lerr"></p><button type="button" class="lg-fg" id="lgFg">忘记密码？</button></div>`

      const id=getId();if(lgLeft()){lgLocked(ctx,me?null:id);return}

      busy=true;btn.disabled=true;btn.classList.add('ld');btn.textContent='正在登录…';err.textContent='';

        if(pw.value!==LG_PWD&&!match){const L=LG();L.fails++;const left=LG_MAX-L.fails;pw.value='';chk();
          if(left<=0){L.lockUntil=Date.now()+30*60000;L.fails=0;err.textContent='';lgLocked(ctx,me?null:id)}

          pw.focus();return}

        if(me)lgFinish(ctx,false);else lgVerify(ctx)},700)});

    pw.addEventListener('input',()=>{if(err.textContent&&!lgLeft())err.textContent=''});
    el.querySelector('#lgFg').onclick=()=>{const id=me?null:getId();push('pwdForgot',{ctx,k:id?id.k:'email',pre:id?id.v:''})};
    const f=el.querySelector('#lgFace');if(f)f.onclick=()=>faceAuth(()=>lgFinish(ctx,false));
    const sw=el.querySelector('#lgSw');if(sw)sw.onclick=()=>{const x=stack.pop();x.remove();push('login',{from:p.from,fresh:1})};

    el.querySelectorAll('[data-sso]').forEach(b=>b.onclick=()=>sysAlert(b.dataset.sso,()=>{ctx.pending=null;lgVerify(ctx)}))}}};

/* ---------- v5.7 两步验证方式管理 + 敏感操作再次验证 ---------- */
const nowCN=()=>{const t=new Date();return `${TODAY.getFullYear()}年${TODAY.getMonth()+1}月${TODAY.getDate()}日 ${t.toTimeString().slice(0,5)}`};
function MFA(){if(!S.mfa){S.mfa={app:[],passkey:[]};if(S.sw.twofa){if(S.reg.twofa==='passkey')S.mfa.passkey.push({name:'iPhone 16 Pro',at:'2026年9月20日 23:24'});else S.mfa.app.push({name:'Authenticator 1',at:'2026年9月20日 23:24'})}}return S.mfa}
function mfaSync(){const M=MFA();S.sw.twofa=M.app.length+M.passkey.length>0;if(M.passkey.length&&!M.app.length)S.reg.twofa='passkey';else if(M.app.length)S.reg.twofa=M.passkey.length&&S.reg.twofa==='passkey'?'passkey':'app'}
function stepUp(excl,why,onOk){
  const fld=(id,l,ph)=>`<div class="field"><label for="${id}">${l}</label><div class="inwrap"><input class="input" id="${id}" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="${ph}"><button class="inbtn" id="${id}b">发送验证码</button></div></div>`;
  const sh=openSheet('',`<div class="su-v"><span class="su-ic">${ic('shield',26,2)}</span><h2>验证身份</h2><p>${esc(why)}</p>
    ${fld('suE','邮箱验证码','输入 6 位邮箱验证码')}${fld('suS','短信验证码','输入 6 位短信验证码')}
    <button class="btn" id="suGo" style="margin-top:6px" disabled>验证</button></div>`);
  const e1=sh.querySelector('#suE'),e2=sh.querySelector('#suS'),go=sh.querySelector('#suGo');
  const chk=()=>{[e1,e2].forEach(x=>x.value=x.value.replace(/\D/g,'').slice(0,6));go.disabled=!(e1.value.length===6&&e2.value.length===6)};e1.oninput=chk;e2.oninput=chk;
  const cd=(b,msg)=>{if(b.disabled)return;toast(msg);let n=60;b.disabled=true;b.textContent=n+' 秒';const t=setInterval(()=>{n--;if(n<=0||!b.isConnected){clearInterval(t);b.disabled=false;b.textContent='重新发送';return}b.textContent=n+' 秒'},1000)};
  sh.querySelector('#suEb').onclick=e=>cd(e.currentTarget,'验证码已发送至你的邮箱');
  sh.querySelector('#suSb').onclick=e=>cd(e.currentTarget,'验证码已发送至你的手机');
  go.onclick=()=>{toast('验证通过');closeSheet(true);setTimeout(onOk,260)}}
function addAuthSheet(onAdded){const sh=openSheet('添加身份验证器',`<div class="aa"><p class="lead" style="margin:2px 2px 12px">在身份验证器 App 中扫描二维码，或复制密钥手动添加。</p>
   <div class="tf-qr aa-qr">${qrSvg('otpauth://totp/INEN:'+(S.reg.email||'user')+Date.now())}</div>

   <div class="field" style="margin-top:14px"><label for="aac">输入验证器显示的 6 位验证码</label><input class="input" id="aac" inputmode="numeric" maxlength="6" placeholder="6 位验证码"></div>
   <button class="btn" id="aaok" disabled>完成添加</button></div>`);

P.mfaM=({t})=>{const app=t==='app';

  foot:`<button class="btn" id="mfadd">${app?'添加身份验证器':'添加通行密钥'}</button>`,

    el.querySelector('#mfl').onclick=e=>{const b=e.target.closest('[data-mi]');if(!b)return;const i=+b.dataset.mi,x=M[t][i];const last=M.app.length+M.passkey.length===1;
      openSheet('',`<div class="mf-rm"><span class="mf-warn">${ic('warnT',30,2.2)}</span><h2>确定要移除“${esc(x.name)}”吗？</h2><p>移除后将无法再用它验证操作。${last?'移除后，转出资金只需验证邮箱和短信。':''}</p><button class="btn" id="mfy" style="background:var(--down);color:#fff">移除</button><button class="btn ghost" style="margin-top:10px" data-act="closeSheet">取消</button></div>`,ev=>{if(!ev.target.closest('#mfy'))return;closeSheet(true);
        setTimeout(()=>stepUp(t,'为保障账户安全，移除验证方式前请先完成邮箱和短信验证。',()=>{M[t].splice(i,1);mfaSync();refresh();draw();toast(`已移除 ${x.name}`);secEvent(app?'已移除身份验证器':'已移除通行密钥',x.name,{ic:app?'key':'scan2'})}),260)})};
    el.querySelector('#mfadd').onclick=()=>stepUp(null,'为保障账户安全，添加验证方式前请先完成邮箱和短信验证。',()=>{

      <div class="cam"><div class="cam-card ${S.k.doc==='PASSPORT'?'pp':''}"><i></i><i></i><i></i><i></i><div class="cam-ghost">${S.k.doc==='PASSPORT'?'PASSPORT':k==='front'?'居民身份证':'中华人民共和国'}</div></div></div>
      <p class="cam-st" id="cst">将证件放入框内</p>
      <div class="ss-dots">${shots.map((_,j)=>`<i class="${j<i?'on':j===i?'cur':''}"></i>`).join('')}</div>
      <div class="sh-w"><svg class="sh-r" viewBox="0 0 84 84"><circle cx="42" cy="42" r="40" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="3"/><circle class="sh-p" cx="42" cy="42" r="40" fill="none" stroke="#C9A574" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 251.3" transform="rotate(-90 42 42)"/></svg><button class="shutter" aria-label="拍摄"></button></div>`;
      let done=false;const shoot=()=>{if(done)return;done=true;box.querySelector('.cam').classList.add('flash');setTimeout(()=>{i++;i<shots.length?cap():ocr()},500)};
      box.querySelector('.shutter').onclick=shoot;
      setTimeout(()=>{const cc=box.querySelector('.cam-card'),st=box.querySelector('#cst');if(!cc||done)return;cc.classList.add('det');st.textContent='保持稳定';box.querySelector('.sh-p').classList.add('run');
        setTimeout(()=>{if(!box.querySelector('#cst')||done)return;st.textContent='已识别';setTimeout(shoot,300)},2000)},1100)};
    const ocr=()=>{box.innerHTML=`<div class="ss-proc"><div class="spin"></div><h3>正在读取证件信息</h3><p>通常需要几秒钟，请勿退出</p></div>`;setTimeout(()=>{if(mode==='upd'){push('idUpdCheck');return}S.k.docUp=true;savePending();push('kycOcr')},1300)};
    const live=()=>{const steps=['请正对屏幕','缓慢向左转头','缓慢向右转头','请眨眼'];let s2=0;
      box.innerHTML=`<h3>人脸活体检测</h3><p id="lt">${steps[0]}</p><div class="face"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="6"/><circle id="lr" cx="110" cy="110" r="100" fill="none" stroke="#C9A574" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 628" transform="rotate(-90 110 110)"/></svg><div class="face-in">${ic('user',64,1.4)}</div></div><p class="ss-note">请摘下帽子、口罩和墨镜，并保持面部光线充足</p>`;
      const t=setInterval(()=>{s2++;const lr=box.querySelector('#lr');if(!lr){clearInterval(t);return}lr.setAttribute('stroke-dasharray',`${(628*s2/steps.length).toFixed(0)} 628`);
        if(s2<steps.length)box.querySelector('#lt').textContent=steps[s2];else{clearInterval(t);proc()}},900)};
    const proc=()=>{box.innerHTML=`<div class="ss-proc"><div class="spin"></div><h3>正在核验身份</h3><p>正在比对证件、个人信息与人脸，请勿退出</p></div>`;
      setTimeout(()=>{box.innerHTML=`<div class="ss-proc"><div class="okc" style="margin:0 auto">${ic('check',38,2.6)}</div><h3>身份核验通过</h3><p>证件、个人信息与人脸比对一致</p><button class="btn" id="ssn" style="margin-top:24px">继续</button></div>`;
        box.querySelector('#ssn').onclick=()=>{S.kyc=1;S.needKyc=false;clearPending();S.user={name:S.k.fn[0]+S.k.fn.slice(1).toLowerCase(),full:`${S.k.fn} ${S.k.ln}`,init:S.k.ln[0]||S.k.fn[0]};refresh();push('kycL1Done')}},1600)};
    mode==='live'?live():cap();
  }};};
P.kycOcr=()=>{const k=S.k;const F=[['ln','姓',k.ln,1],['fn','名',k.fn,1],['sx2','性别',k.sx==='F'?'女':'男',1],['bd2','出生日期',k.bd,1],['idn2','证件号码',k.idn,1],['exp','证件有效期至','',0]];
  return {cls:'ob',title:segs(3,4),right:'',body:`<h1 class="h1">核对证件信息</h1><p class="lead">以下信息由系统从证件中自动识别。请逐项与证件原件核对，如有遗漏或错误请直接修改。</p>

  <button class="item ckrow" id="cf"><span class="ck"></span><span class="it"><b style="font-weight:500;font-size:13.5px;line-height:1.6">我确认以上信息真实、准确。</b></span></button>`,
  foot:`<button class="btn" id="next">确认，下一步：人脸识别</button>`,
  mount(el){let ok=false;el.querySelector('#cf').onclick=e=>{ok=!ok;e.currentTarget.classList.toggle('on',ok)};
    el.querySelector('.ocr-c').addEventListener('click',e=>{const r=e.target.closest('[data-ocr]');if(!r||r.classList.contains('ed'))return;r.classList.add('ed');const i=r.querySelector('input');i.focus()});
    el.querySelector('.ocr-c').addEventListener('input',e=>{const r=e.target.closest('[data-ocr]');if(r){r.querySelector('b').textContent=e.target.value;r.classList.remove('miss')}});
    formMount(el,()=>ok&&['ln','fn','bd2','idn2','exp'].every(i=>V(el,i)),()=>{Object.assign(S.k,{ln:V(el,'ln').toUpperCase(),fn:V(el,'fn').toUpperCase(),bd:V(el,'bd2'),idn:V(el,'idn2').toUpperCase(),exp:V(el,'exp')});S.k.ocrOk=true;savePending();bioConsent(()=>push('kycSumsub',{mode:'live'}))})}};};

P.kyc2Tax=()=>({cls:'ob',title:segs(3,7),right:obClose,body:`<h1 class="h1">签署税务表格</h1><p class="lead">依据 FATCA，非美国税务居民签署 W-8BEN，美国税务居民填写 W-9。</p>

 earn:{zh:'理财风险揭示书',en:'INEN Earn Risk Disclosure',d:'2026-10-14',zhS:[["前言", "将资产投入盈安理财，即表示你确认已阅读、理解并接受下述风险。"], ["1. 非存款或储蓄", "盈安理财为 USDT 链上理财产品，不是银行存款或储蓄账户。投入的资产不受任何公共或私人存款保险保障，也不属于美元账户所在美国持牌银行的存款。你可能损失投入的本金。"], ["2. 交易对手方风险", "盈安会将你投入的资金用于旨在产生收益的交易，包括但不限于质押借贷、杠杆借贷和其他借贷。若交易对手方违约（如破产无法偿还借贷本金），盈安可能无法在该交易中收回你投入的资金，你将无法获得此前展示的参考年化，并可能损失部分或全部资金。盈安不就交易对手方风险承担责任，也不以自有资金弥补由此造成的损失。"], ["3. 交易平台风险", "交易对手方风险也可能来自数字资产交易平台。许多交易平台不公开其所有权、管理团队、公司治理或合规信息，较传统金融市场更容易面临盗窃、欺诈和市场操纵。借款人可能将资金用于在第三方数字资产交易平台进行交易；如交易平台倒闭、被盗或停止运营，盈安可能无法收回你投入的资金，你可能损失部分或全部资金。盈安不就交易平台风险承担责任。"], ["4. 市场风险", "数字资产市场波动远高于传统资产市场。若市场在短时间内急速下跌，交易对手方质押的数字资产可能难以以合理价格变现，导致借贷无法全额偿还。极端波动可能导致你损失部分或全部资金，盈安不对市场风险承担责任。"], ["5. 数字资产交易风险极高", "申购前，你确认具备足够的数字资产知识、金融专业知识和经验，并有能力承担数字资产交易带来的风险。"], ["6. 美元计价损失", "盈安理财以 USDT 计价，本金和收益均以 USDT 支付。USDT 与美元的兑换价格可能波动或脱锚；以美元计算时，你可能损失部分或全部投入的资金。美元或 USDC 申购时按实时汇率兑换为 USDT。"], ["7. 极端市场条件下的转出限制", "剧烈价格波动等极端市场条件可能导致大量集中的转出请求，影响产品正常运行。盈安可能因此暂缓处理或限制转出请求。"], ["8. 欺诈、网络攻击、盗窃、操纵或安全故障风险", "链上交易不可逆转，因欺诈、盗窃、操纵、智能合约漏洞或安全故障造成的损失可能无法追回。"], ["9. 适用地区", "盈安就本产品提供的任何信息（包括但不限于 App 页面、订单系统和产品页面）不构成向美国居民或法律禁止该要约或招揽的其他国家或地区居民发出的出售要约或购买要约邀请。"]],enS:[["Preamble", "By placing assets in INEN Earn, you confirm that you have read, understood and accepted the following risks."], ["1. Not a deposit or savings account", "INEN Earn is an on-chain USDT product, not a bank deposit or savings account. Assets are not covered by any public or private deposit insurance and are not deposits at the US-licensed bank that holds your USD account. You may lose your principal."], ["2. Counterparty risk", "Funds are used in yield-generating transactions, including collateralised lending, leveraged lending and other lending. If a counterparty defaults (e.g. becomes insolvent), INEN may be unable to recover your funds; you may not receive the displayed reference APY and may lose some or all of your funds. INEN is not liable for counterparty risk and will not use its own funds to cover such losses."], ["3. Exchange risk", "Counterparty risk may also arise from digital asset exchanges. Many exchanges do not disclose ownership, management, governance or compliance information and are more exposed to theft, fraud and manipulation than traditional markets. Borrowers may trade the funds on third-party exchanges; if an exchange fails, is hacked or ceases operations, INEN may be unable to recover your funds and you may lose some or all of them. INEN is not liable for exchange risk."], ["4. Market risk", "Digital asset markets are far more volatile than traditional markets. In a sudden crash, collateral may not be liquidated at a fair price and loans may not be fully repaid. Extreme volatility may cause you to lose some or all of your funds. INEN is not liable for market risk."], ["5. Digital asset trading is high risk", "Before subscribing, you confirm that you have sufficient knowledge of digital assets and finance, and can bear the risks of digital asset transactions."], ["6. USD-denominated loss", "INEN Earn is denominated in USDT; principal and earnings are paid in USDT. USDT may fluctuate against or depeg from the US dollar, so measured in USD you may lose some or all of your funds. USD or USDC subscriptions are converted to USDT at the live rate."], ["7. Withdrawal limits in extreme markets", "Extreme conditions may trigger a surge of withdrawal requests that affects normal operation. INEN may delay or limit withdrawals in such cases."], ["8. Fraud, cyberattack, theft, manipulation or security failure", "On-chain transactions are irreversible; losses from fraud, theft, manipulation, smart-contract bugs or security failures may not be recoverable."], ["9. Restricted jurisdictions", "Information about this product (including app pages, order system and product pages) is not an offer to sell or a solicitation of an offer to buy to residents of the United States or any other jurisdiction where such offer or solicitation is prohibited."]]},

   ['3. 开户资格','你须年满 18 周岁，具备完全民事行为能力，且不属于受限制国家或地区的居民。你承诺以本人名义开户、使用账户，不代表任何第三方，不出租、出借或转让账户。'],
   ['4. 身份核验与合规','依据反洗钱（AML）、反恐怖融资（CTF）及“了解你的客户”（KYC）等监管要求，我们及开户银行将核验你的身份并持续开展尽职调查。你应如实、完整地提供资料，并在信息变更时及时更新。如我们认为存在可疑交易或合规风险，有权要求你补充材料，或限制、暂停相关服务。'],
   ['5. 账户安全','你应妥善保管登录密码、交易密码、验证码、两步验证设备与恢复码。盈安工作人员不会以任何理由向你索取上述信息。如发现账户异常，请立即冻结卡片并联系客服。'],
   ['6. 费用','各项服务的费用以 App 内「费率说明」及交易确认页展示为准。我们如调整收费标准，将提前通过 App 或邮件通知你。'],
   ['7. 风险提示','稳定币价格可能出现波动；理财产品的参考年化收益率不代表未来收益，理财资产不属于银行存款，存在本金损失的可能。请在充分了解风险后使用相关服务。'],
   ['8. 服务变更与终止','我们可根据业务发展或监管要求调整、暂停或终止部分服务，并提前合理通知。你可随时申请注销账户，注销前须结清余额及未完成交易。'],
   ['9. 适用法律与争议解决','本协议适用美利坚合众国法律。因本协议产生的争议，双方应先友好协商；协商不成的，提交有管辖权的法院解决。'],
   ['10. 联系我们','如对本协议有任何疑问，请通过 App 内「客服」或邮件 support@inen.example 联系我们。']],
  enS:[['1. Parties','This Agreement is between you and INEN FINTECH LTD ("INEN", "we"), a Money Services Business registered with the US Financial Crimes Enforcement Network (FinCEN). By registering for, signing in to or using the INEN app and services, you confirm you have read, understood and agree to this Agreement.'],
   ['2. Services','INEN provides a stablecoin wallet, access to a USD account, a virtual card, Earn, transfers and conversion. Your USD account is opened and held in your name at a US-licensed bank; INEN acts as the technology and service provider. Some services require additional terms.'],
   ['3. Eligibility','You must be 18 or older, have full legal capacity and not reside in a restricted country or region. You will open and use the account in your own name only and will not rent, lend or transfer it.'],
   ['4. Verification and compliance','Under AML, CTF and KYC regulations, we and the account-holding bank will verify your identity and conduct ongoing due diligence. Provide accurate, complete information and keep it up to date. We may request more documents or restrict services where we identify suspicious activity or compliance risk.'],
   ['5. Account security','Keep your password, transaction PIN, verification codes, 2-step verification device and recovery codes safe. INEN staff will never ask for them. If you notice unusual activity, freeze your card and contact support immediately.'],
   ['6. Fees','Fees are shown in the in-app Fee Schedule and on each confirmation screen. We will notify you in advance of any fee changes.'],
   ['7. Risks','Stablecoin prices may fluctuate. Reference APYs for Earn are not a guarantee of future returns; Earn assets are not bank deposits and principal may be lost.'],
   ['8. Changes and termination','We may change, suspend or end services for business or regulatory reasons with reasonable notice. You may close your account at any time after settling balances and pending transactions.'],
   ['9. Governing law','This Agreement is governed by the laws of the United States of America. Disputes will first be resolved through good-faith negotiation, failing which by a court of competent jurisdiction.'],
   ['10. Contact','Questions? Contact us via in-app Support or support@inen.example.']]},
 privacy:{zh:'隐私政策',en:'Privacy Policy',d:'2026-10-01',
  zhS:[['1. 我们收集的信息','身份信息（姓名、性别、出生日期、证件信息、人脸影像）；联系方式（邮箱、手机号码）；地址及地址证明；税务身份信息（W-8BEN / W-9）；职业、收入与资金来源；交易与账户使用记录；设备与登录信息。'],
   ['2. 使用目的','用于开立和管理账户、履行反洗钱等法定义务、处理交易、防范欺诈与保障账户安全、提供客户服务，以及在你同意的情况下发送产品通知。'],
   ['3. 信息共享','我们仅在必要范围内与以下对象共享你的信息：为你开立并持有美元账户的美国持牌银行；身份验证服务商（如 Sumsub）；支付网络与卡组织（如 Visa）；以及依法要求提供信息的监管或执法机构。我们不会出售你的个人信息。'],
   ['4. 跨境传输','为提供服务，你的信息可能被传输至美国或其他国家和地区处理。我们将采取合同及技术措施，确保其获得与本政策一致的保护。'],
   ['5. 存储与保护','你的信息经加密存储，访问受严格权限控制。依据监管要求，开户及交易记录通常在账户关闭后至少保存 5 年。'],
   ['6. 你的权利','你可以查阅、更正你的个人信息，撤回营销通知授权，或申请注销账户。法律规定须保留的信息除外。'],
   ['7. 联系我们','如对本政策有疑问，请联系 privacy@inen.example。']],
  enS:[['1. Information we collect','Identity details (name, gender, date of birth, ID document, facial images); contact details (email, phone); address and proof of address; tax status (W-8BEN / W-9); occupation, income and source of funds; transaction and usage records; device and sign-in data.'],
   ['2. How we use it','To open and manage your account, meet AML and other legal obligations, process transactions, prevent fraud, keep your account secure, provide support and, with your consent, send product updates.'],
   ['3. Sharing','We share information only as necessary with: the US-licensed bank that opens and holds your USD account; identity-verification providers (such as Sumsub); payment and card networks (such as Visa); and regulators or law enforcement where legally required. We never sell your personal information.'],
   ['4. International transfers','Your information may be processed in the United States or other jurisdictions. We use contractual and technical safeguards to protect it consistently with this Policy.'],
   ['5. Storage and security','Your data is encrypted and access is strictly controlled. Account and transaction records are generally kept for at least 5 years after account closure, as required by regulation.'],
   ['6. Your rights','You may access and correct your information, withdraw marketing consent or request account closure, except where we must retain data by law.'],
   ['7. Contact','Questions? Email privacy@inen.example.']]},
 usd:{zh:'美元账户服务条款',en:'USD Account Terms',d:'2026-10-01',
  zhS:[['1. 账户性质','美元账户为美国持牌银行以你本人名义开立的活期账户（Checking），拥有独立账号与 ACH 路由号。账户资金由开户银行持有，盈安不持有你的美元账户资金。'],
   ['2. 入金与出金','你可以通过 ACH、Wire（FedWire）及 SWIFT 向账户入金，入账免费；汇款途经的中间行可能按其标准扣收费用。本人或第三方均可汇款入账，开户银行可能就第三方汇款要求补充资料。出金费用以 App 内展示为准。'],
   ['3. 交易限制','开户银行可依据风控及监管要求，对单笔或累计交易金额、交易对手及交易国家设定限制，并可要求你说明交易背景或提供证明材料。'],
   ['4. 存款保险','美元账户资金是否受存款保险保障，以开户银行的适用规定为准。理财、稳定币等资产不属于银行存款，不受存款保险保障。'],
   ['5. 月结单','我们将于每月初生成上月月结单，并发送至你的注册邮箱。如有疑问，请于结单日起 60 日内告知我们。'],
   ['6. 开户银行变更','为持续提供更优的服务与费率，盈安可能与其他美国持牌银行合作。如需将你的账户迁移至新的开户银行，我们将至少提前 30 日通知你，并说明账户信息的变化及过渡安排。'],
   ['7. 账户关闭','你可随时申请关闭美元账户。开户银行亦可因合规原因关闭账户，届时将按规定退还余额。']],
  enS:[['1. Account type','Your USD account is a checking account opened in your name at a US-licensed bank, with its own account and ACH routing numbers. Funds are held by the bank; INEN does not hold your USD account funds.'],
   ['2. Deposits and withdrawals','You can deposit via ACH, Wire (FedWire) and SWIFT free of charge; intermediary banks may deduct their own fees. Transfers may come from you or a third party; the account bank may request additional information for third-party transfers. Withdrawal fees are shown in the app.'],
   ['3. Limits','The bank may set limits on amounts, counterparties and countries for risk and regulatory reasons, and may ask you to explain or document a transaction.'],
   ['4. Deposit insurance','Whether USD account funds are covered by deposit insurance depends on the account-holding bank\'s applicable rules. Earn and stablecoin assets are not bank deposits and are not insured.'],
   ['5. Statements','We generate a statement at the start of each month and email it to you. Report any discrepancy within 60 days of the statement date.'],
   ['6. Change of bank','To keep offering better service and pricing, INEN may work with other US-licensed banks. If your account needs to move to a new bank, we will give you at least 30 days\' notice and explain any changes to your account details.'],
   ['7. Closure','You may close your USD account at any time. The bank may also close it for compliance reasons and will return any balance as required.']]},
 esign:{zh:'电子签名授权',en:'E-Sign Consent',d:'2026-10-01',
  zhS:[['1. 授权范围','你同意以电子方式签署开户申请、W-8BEN / W-9 税务表格及其他相关协议，电子签名与手写签名具有同等法律效力（依据美国《全球及国家商务电子签名法》E-SIGN Act）。'],
   ['2. 电子文件送达','你同意以电子方式接收协议、月结单、税务文件及其他通知，包括通过 App 内消息和注册邮箱发送。'],
   ['3. 撤回授权','你可随时联系客服撤回本授权。撤回后，部分需要电子签署的服务可能无法继续提供。'],
   ['4. 系统要求','你需要能够访问 App 或电子邮箱，并能打开 PDF 文件。']],
  enS:[['1. Scope','You agree to sign your application, Forms W-8BEN / W-9 and related agreements electronically. Electronic signatures have the same legal effect as handwritten ones under the US E-SIGN Act.'],
   ['2. Electronic delivery','You agree to receive agreements, statements, tax documents and notices electronically, in the app and by email.'],
   ['3. Withdrawal','You may withdraw this consent at any time via Support. Some services that require e-signature may then be unavailable.'],
   ['4. Requirements','You need access to the app or your email and the ability to open PDF files.']]},
 trade:{zh:'交易服务协议',en:'Trading Services Agreement',d:'2026-10-01',
  zhS:[['1. 服务提供方','交易服务由持牌合作机构提供，你需与其单独订立交易协议。盈安提供交易界面及资金划转服务。'],['2. 交易账户','交易账户为独立的美元账户，资金须从美元账户划转后方可交易。'],['3. 订单执行','订单按合作机构的执行规则处理，市场剧烈波动时成交价格可能与下单价格存在差异。'],['4. 资格限制','美国居民或美国纳税人不可开通交易账户。']],
  enS:[['1. Provider','Trading services are provided by a licensed partner, with whom you enter a separate agreement. INEN provides the trading interface and fund transfers.'],['2. Trading account','Your trading account is a separate USD account funded by transfers from your USD account.'],['3. Execution','Orders follow the partner\'s execution policy; in fast markets the fill price may differ from the order price.'],['4. Eligibility','US residents and US taxpayers cannot open a trading account.']]},
 risk:{zh:'风险揭示书',en:'Risk Disclosure',d:'2026-10-01',
  zhS:[['杠杆风险','差价合约和期货为杠杆产品，较小的价格波动即可能导致重大亏损，你可能损失全部保证金。'],['市场风险','黄金、白银等价格受全球市场影响，可能剧烈波动。'],['流动性风险','特殊市场情况下可能无法按预期价格成交或平仓。'],['强制平仓','保证金不足时，持仓可能被强制平仓。'],['确认','请仅使用你能够承受损失的资金进行交易。']],
  enS:[['Leverage','CFDs and futures are leveraged; small price moves can cause large losses and you may lose all your margin.'],['Market','Gold, silver and other prices are driven by global markets and can be volatile.'],['Liquidity','In unusual conditions you may be unable to trade or close at the expected price.'],['Margin call','Positions may be closed automatically if margin is insufficient.'],['Acknowledgement','Only trade with money you can afford to lose.']]}
};
function openLegal(k){const L=LEGAL[k];if(!L)return;const en=LANG==='en';const o=document.createElement('section');o.className='page lgl';

  <div class="pc" data-noi18n><h1 class="h1" style="margin-bottom:4px">${en?L.en:L.zh}</h1><p class="lgl-d">${en?'Effective':'生效日期'} ${L.d}</p>
  <div class="lgl-n">${en?'Prototype sample text. The final version is subject to legal review.':'原型示例文本，正式版本以法务审定为准。'}</div>
  ${(en?L.enS:L.zhS).map(([h,t])=>`<h3>${esc(h)}</h3><p>${esc(t)}</p>`).join('')}</div>
  <div class="pf"><button class="btn" data-lgx>${en?'Done':'我已阅读'}</button></div>`;
 app.appendChild(o);requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('in')));

function spark(c){const base=T.series.slice(-24);let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))>>>0;const ph=(h%628)/100,fq=.35+(h%7)/20,amp=(1.2+(h%5)*.5);
  const s=base.map((v,i)=>v+Math.sin(i*fq+ph)*amp+Math.sin(i*.9+ph*2)*amp*.4);const mn=Math.min(...s),mx=Math.max(...s),rg=(mx-mn)||1;const up=q(c).chg>=0;
  const P=s.map((v,i)=>[i/(s.length-1)*54+1,17-((v-mn)/rg)*14]);let d='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}
  const L=P[P.length-1],col=up?'var(--up)':'var(--down)';
  return `<svg class="spk" viewBox="0 0 56 20" width="56" height="20" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="1.5" fill="${col}"/></svg>`}

ateralised lending, leveraged lending and other lending. If a counterparty defaults (e.g. becomes insolvent), INEN may be unable to recover your funds; you may not receive the displayed reference APY and may lose some or all of your funds. INEN is not liable for counterparty risk and will not use its own funds to cover such losses.", "交易平台风险。": "Exchange risk.", "交易对手方风险也可能来自数字资产交易平台。许多交易平台不公开其所有权、管理团队、公司治理或合规信息，较传统金融市场更容易面临盗窃、欺诈和市场操纵。借款人可能将资金用于在第三方数字资产交易平台进行交易；如交易平台倒闭、被盗或停止运营，盈安可能无法收回你投入的资金，你可能损失部分或全部资金。盈安不就交易平台风险承担责任。": "Counterparty risk may also arise from digital asset exchanges. Many exchanges do not disclose ownership, management, governance or compliance information and are more exposed to theft, fraud and manipulation than traditional markets. Borrowers may trade the funds on third-party exchanges; if an exchange fails, is hacked or ceases operations, INEN may be unable to recover your funds and you may lose some or all of them. INEN is not liable for exchange risk.", "市场风险。": "Market risk.", "数字资产市场波动远高于传统资产市场。若市场在短时间内急速下跌，交易对手方质押的数字资产可能难以以合理价格变现，导致借贷无法全额偿还。极端波动可能导致你损失部分或全部资金，盈安不对市场风险承担责任。": "Digital asset markets are far more volatile than traditional markets. In a sudden crash, collateral may not be liquidated at a fair price and loans may not be fully repaid. Extreme volatility may cause you to lose some or all of your funds. INEN is not liable for market risk.", "数字资产交易风险极高。": "Digital asset trading is high risk.", "申购前，你确认具备足够的数字资产知识、金融专业知识和经验，并有能力承担数字资产交易带来的风险。": "Before subscribing, you confirm that you have sufficient knowledge of digital assets and finance, and can bear the risks of digital asset transactions.", "美元计价损失。": "USD-denominated loss.", "盈安理财以 USDT 计价，本金和收益均以 USDT 支付。USDT 与美元的兑换价格可能波动或脱锚；以美元计算时，你可能损失部分或全部投入的资金。美元或 USDC 申购时按实时汇率兑换为 USDT。": "INEN Earn is denominated in USDT; principal and earnings are paid in USDT. USDT may fluctuate against or depeg from the US dollar, so measured in USD you may lose some or all of your funds. USD or USDC subscriptions are converted to USDT at the live rate.", "极端市场条件下的转出限制。": "Withdrawal limits in extreme markets.", "剧烈价格波动等极端市场条件可能导致大量集中的转出请求，影响产品正常运行。盈安可能因此暂缓处理或限制转出请求。": "Extreme conditions may trigger a surge of withdrawal requests that affects normal operation. INEN may delay or limit withdrawals in such cases.", "欺诈、网络攻击、盗窃、操纵或安全故障风险。": "Fraud, cyberattack, theft, manipulation or security failure.", "链上交易不可逆转，因欺诈、盗窃、操纵、智能合约漏洞或安全故障造成的损失可能无法追回。": "On-chain transactions are irreversible; losses from fraud, theft, manipulation, smart-contract bugs or security failures may not be recoverable.", "适用地区。": "Restricted jurisdictions.", "盈安就本产品提供的任何信息（包括但不限于 App 页面、订单系统和产品页面）不构成向美国居民或法律禁止该要约或招揽的其他国家或地区居民发出的出售要约或购买要约邀请。": "Information about this product (including app pages, order system and product pages) is not an offer to sell or a solicitation of an offer to buy to residents of the United States or any other jurisdiction where such offer or solicitation is prohibited.", "美元、USDT、USDC 均可申购": "USD, USDT and USDC accepted", "USDT 链上理财": "On-chain USDT Earn", "盈安理财<br>USDT 链上理财": "INEN Earn<br>On-chain USDT Earn", "最高参考年化": "Max. reference APY", "定期最高参考年化": "Fixed-term, max.", "理财余额 · USDT 链上理财": "Earn balance · On-chain USDT", "美元、USDT、USDC 均可申购，非 USDT 按实时汇率兑换为 USDT 后计息": "USD, USDT and USDC accepted; non-USDT assets are converted to USDT at the live rate before earning", "定期从美元账户申购活期理财": "Recurring purchases from your USD account into Flexible", "USDT 定期": "USDT Fixed-term", "到期自动转入活期 · 非保本，存在本金损失可能": "Moves to Flexible at maturity · not principal-protected", "盈安理财为 USDT 链上理财，资金用于质押借贷等旨在产生收益的链上交易，非保本产品，可能面临交易对手方风险、交易所风险及市场风险等。收益试算按参考年化估算（活期按日计息、定期单利），仅供参考；参考年化浮动，不构成收益承诺。理财资产不属于银行存款，不受任何存款保险保障，可能损失部分或全部本金。": "INEN Earn is an on-chain USDT product. Funds are used in yield-generating on-chain transactions such as collateralised lending. It is not principal-protected and is exposed to counterparty, exchange and market risks. The calculator uses reference APYs (daily accru function trEl(el){if(!el.getAttribute)return;for(const a of I18N_ATTRS){const v=el.getAttribute(a);if(v&&ZHRE.test(v)){(el.__zhA=el.__zhA||{})[a]=v;el.setAttribute(a,trStr(v))}}if(el.nodeName==='INPUT'&&el.readOnly&&ZHRE.test(el.value)){el.__zhV=el.value;el.value=trStr(el.value)}}
function trTree(root){if(root.nodeType===3){trText(root);return}if(root.nodeType!==1||root.nodeName==='SCRIPT'||root.nodeName==='STYLE')return;trEl(root);const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;while((n=w.nextNode())){if(n.nodeType===3)trText(n);else trEl(n)}}
function untrTree(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n=root;do{if(n.nodeType===3){if(n.__zh!==undefined){n.nodeValue=n.__zh;delete n.__zh}}else{if(n.__zhA){for(const a in n.__zhA)n.setAttribute(a,n.__zhA[a]);delete n.__zhA}if(n.__zhV!==undefined){n.value=n.__zhV;delete n.__zhV}}}while((n=w.nextNode()))}
