<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INEN 盈安">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
<title>INEN 盈安 · App 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E7E4DF;
  --bg:#14110E; --bg2:#1D1915; --surface:#221D18; --surface2:#2B251F;
  --line:rgba(232,210,170,.10); --line2:rgba(232,210,170,.18);
  --ink:#F4EEE5; --ink2:#B9AE9F; --ink3:#7E7466;
  --gold:#D2B384; --gold2:#A9885A; --goldInk:#1C160F;
  --up:#6FCF97; --down:#E5796B; --tab:rgba(30,26,22,.86);
  --btn:#F4EEE5; --btnInk:#15110D;
  --silk:.95; --st:50px;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--page);font-family:Inter,"Noto Sans SC",-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.app[data-theme="light"]{
  --bg:#F5F2ED; --bg2:#EFEBE4; --surface:#FFFFFF; --surface2:#F3EFE8;
  --line:rgba(60,45,25,.08); --line2:rgba(60,45,25,.14);
  --ink:#1A1611; --ink2:#6B6155; --ink3:#9C9284;
  --gold:#A7834F; --gold2:#C9AA78; --goldInk:#FFFFFF;
  --up:#1E9E5A; --down:#C4493B; --tab:rgba(255,255,255,.9);
  --btn:#1A1611; --btnInk:#F5F2ED;
  --silk:.55;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0C0A08}}
:root[data-theme="dark"]{--page:#0C0A08}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 40px}
.toolbar{display:flex;align-items:center;gap:12px;font-size:13px;color:#6b6155;flex-wrap:wrap;justify-content:center}
:root[data-theme="dark"] .toolbar{color:#a99d8c}
.seg-mini{display:inline-flex;background:rgba(0,0,0,.06);border-radius:12px;padding:3px}
:root[data-theme="dark"] .seg-mini{background:rgba(255,255,255,.08)}
.seg-mini button{border:0;background:transparent;font-size:13px;padding:6px 14px;border-radius:9px;color:inherit;cursor:pointer}
.seg-mini button[aria-pressed="true"]{background:#fff;color:#1a1611;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.phone{width:390px;max-width:100%;height:844px;border-radius:48px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #1a1714,0 0 0 11px #3a332c,0 40px 80px rgba(0,0,0,.35)}
.app{position:relative;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;transition:background .3s}
.silk{position:absolute;inset:0 0 auto 0;height:620px;pointer-events:none;opacity:var(--silk);
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.status{position:absolute;top:0;left:0;right:0;height:50px;z-index:70;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 6px;font-weight:600;font-size:15px;color:var(--ink)}
.status .ind{display:flex;gap:6px;align-items:center}
.status .batt{width:25px;height:12px;border-radius:4px;border:1.5px solid currentColor;opacity:.9;position:relative}
.status .batt::after{content:"";position:absolute;inset:1.5px;right:6px;background:currentColor;border-radius:2px}

.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:var(--st) 0 120px;scrollbar-width:none}
.view::-webkit-scrollbar,.pc::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.view[hidden]{display:none}

/* home */
.top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0}
.avatar{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);cursor:pointer}
.round{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);cursor:pointer;padding:0}
.bal{position:relative;text-align:center;margin-top:34px}
.bal-label{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);background:transparent;border:0;cursor:pointer;padding:4px 6px}
.flags{display:flex}
.flags span{width:18px;height:18px;border-radius:50%;margin-left:-6px;border:1.5px solid var(--bg);display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.flags span:first-child{margin-left:0}
.amount{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:6px;padding-left:46px}
.amount .num{font-size:50px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.amount .num small{font-size:50px;color:var(--ink3);font-weight:700}
.eye{margin-top:4px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line2);color:var(--ink2);cursor:pointer;padding:0}
.spend{margin:16px auto 0;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);font-size:13px;color:var(--ink2);cursor:pointer}
.spend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.spend .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.actions{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:28px 22px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer}
.act i{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:var(--btn);color:var(--btnInk);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.act:first-child i{background:linear-gradient(145deg,var(--gold),var(--gold2));color:var(--goldInk)}
.promo{position:relative;margin:22px 18px 0;padding:16px 16px 16px 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px;overflow:hidden;cursor:pointer}
.promo h4{margin:0;font-size:15px;font-weight:700}
.promo p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--ink2)}
.mini-cards{margin-left:auto;position:relative;width:86px;height:56px;flex:none}
.mini-cards div{position:absolute;width:62px;height:40px;border-radius:7px}
.mini-cards div:nth-child(1){right:0;top:0;background:linear-gradient(135deg,#d9c29b,#8c6c42);transform:rotate(8deg)}
.mini-cards div:nth-child(2){left:0;bottom:0;background:linear-gradient(135deg,#2f2923,#0f0d0b);border:1px solid rgba(210,179,132,.4);transform:rotate(-6deg)}
.close{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink2);cursor:pointer;display:grid;place-items:center;padding:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:28px 22px 12px}
.sec-h h3{margin:0;font-size:17px;font-weight:700}
.sec-h button{font-size:13px;color:var(--ink2);background:none;border:0;cursor:pointer;padding:0}
.accts{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.accts::-webkit-scrollbar{display:none}
.acct{flex:none;width:158px;scroll-snap-align:start;border-radius:22px;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:22px;text-align:left;color:inherit;cursor:pointer}
.acct .h{display:flex;align-items:center;gap:10px}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.acct .h b{display:block;font-size:14px;font-weight:600}
.acct .h span{font-size:12px;color:var(--ink3)}
.acct .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.acct .f{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px 0}
.tile{border-radius:22px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:inherit;text-align:left}
.tile .t{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldInk)}
.tile .v{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.card-wrap{padding:0 18px;position:relative}
.card-wrap::after{content:"";position:absolute;left:36px;right:36px;bottom:-8px;height:20px;border-radius:0 0 20px 20px;background:var(--surface2);z-index:0}
.vcard{position:relative;z-index:1;aspect-ratio:1.586;border-radius:24px;overflow:hidden;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;color:#F4EEE5;cursor:pointer;
  background:radial-gradient(120% 90% at 85% 10%,#4a3d2e 0%,#1d1814 45%,#0f0d0b 100%);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.vcard svg.lines{position:absolute;inset:0;width:100%;height:100%}
.vcard .row{position:relative;display:flex;justify-content:space-between;align-items:center}
.vcard.frozen{filter:grayscale(1) brightness(.75)}
.vcard .frz{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px;z-index:2;background:rgba(15,13,11,.35);letter-spacing:.1em}
.brand{font-weight:800;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand em{font-style:normal;font-weight:500;font-size:13px;color:#cdbfa9}
.chip{font-size:11px;padding:3px 8px;border-radius:8px;background:rgba(244,238,229,.12);border:1px solid rgba(244,238,229,.18);color:#e6dccd}
.vcard .bal2 b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.vcard .bal2 span{display:block;font-size:12px;color:#b9ad9b;margin-bottom:2px}
.pan{font-size:15px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.visa{font-weight:800;font-style:italic;font-size:20px;letter-spacing:-.02em}
.card-cta{display:flex;gap:10px;padding:22px 18px 0}
.card-cta button{flex:1;height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.setup{margin:22px 18px 0;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.setup h4{margin:0;font-size:15px;font-weight:700}
.setup p{margin:4px 0 10px;font-size:13px;color:var(--ink2);line-height:1.5}
.setup .sbtn{border:0;background:var(--btn);color:var(--btnInk);font-size:13px;font-weight:600;padding:8px 14px;border-radius:12px;cursor:pointer}
.ring{margin-left:auto;flex:none;position:relative;width:64px;height:64px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700}
.tx{margin:0 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:4px 16px}
.txr{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.txr+.txr{border-top:1px solid var(--line)}
.txr .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--surface2)}
.txr .m{flex:1;min-width:0}
.txr .m b{display:block;font-size:15px;font-weight:600}
.txr .m span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.txr .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.txr .r b{display:block;font-size:15px;font-weight:600}
.txr .r span{font-size:12px;color:var(--ink3)}
.pos{color:var(--up)} .neg{color:var(--down)}
.masked{filter:blur(9px);transition:filter .2s}

/* tab bar */
.tabbar{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:70px;border-radius:26px;background:var(--tab);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:10}
.tabbar button{border:0;background:transparent;color:var(--ink3);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:18px;cursor:pointer;padding:0}
.tabbar button[aria-current="page"]{background:var(--surface2);color:var(--ink)}
.tabbar .ico{position:relative;display:grid;place-items:center}
.badge{position:absolute;top:-7px;left:14px;min-width:24px;height:16px;padding:0 5px;border-radius:8px;font-size:10px;font-weight:700;line-height:16px;text-align:center;color:var(--goldInk);background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 0 0 2px var(--tab)}

/* tab headers */
.vh{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px}
.vh h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}

/* pages */
.page{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.page.in{transform:none}
.ph{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(var(--st) + 8px) 16px 6px}
.ph h2{margin:0;text-align:center;font-size:17px;font-weight:700}
.ph>div{display:flex;justify-content:flex-end}
.pc{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 18px 28px;scrollbar-width:none}
.pf{flex:none;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 6px;line-height:1.25}
.lead{color:var(--ink2);font-size:14px;margin:0 4px 18px;line-height:1.55}
.lbl{font-size:13px;color:var(--ink3);margin:22px 6px 8px}
.note{font-size:12.5px;color:var(--ink3);line-height:1.6;margin:14px 6px 0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font-size:15px}
.item+.item{border-top:1px solid var(--line)}
.ii{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);flex:none;color:var(--ink)}
.it{flex:1;min-width:0}
.it b{display:block;font-size:15px;font-weight:600}
.it span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.it span.chips{display:flex;margin-top:7px}
.it span.pill{display:inline-block;margin-top:0;font-size:11.5px;color:var(--ink2);line-height:1.4}
.it span.pill.ok{color:var(--up)}
.ir{color:var(--ink3);display:flex;align-items:center;gap:8px;font-size:13px;flex:none}
.pill{font-size:11.5px;padding:3px 8px;border-radius:8px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:rgba(111,207,151,.14);color:var(--up)}
.pill.warn{background:rgba(229,121,107,.14);color:var(--down)}
.pill.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldInk);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.btn{width:100%;height:54px;border-radius:18px;border:0;background:var(--btn);color:var(--btnInk);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldInk)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btns{display:flex;gap:10px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--ink2);margin:0 4px 7px}
.input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:0 16px;outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--gold)}
.input[readonly]{background:var(--surface2)}
.inwrap{position:relative}
.inwrap .input{padding-right:84px}
.inwrap .inbtn{position:absolute;right:8px;top:8px;height:36px;padding:0 12px;border-radius:12px;border:0;background:var(--surface2);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.seg{display:flex;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:14px;font-weight:600;padding:9px 6px;border-radius:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.switch{width:50px;height:30px;border-radius:15px;background:var(--surface2);border:1px solid var(--line2);position:relative;cursor:pointer;flex:none;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink3);transition:left .2s,background .2s}
.switch[aria-checked="true"]{background:var(--gold);border-color:transparent}
.switch[aria-checked="true"]::after{left:23px;background:#fff}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--ink3);flex:none}
.kv b{font-weight:600;text-align:right;word-break:break-all}
.copyrow{display:flex;align-items:center;gap:12px;padding:13px 16px}
.copyrow+.copyrow{border-top:1px solid var(--line)}
.copyrow div{flex:1;min-width:0}
.copyrow small{display:block;font-size:12.5px;color:var(--ink3)}
.copyrow b{display:block;font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;word-break:break-all}
.cbtn{width:36px;height:36px;border-radius:12px;border:0;background:var(--surface2);color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.search{position:relative;margin-bottom:6px}
.search svg{position:absolute;left:14px;top:16px;color:var(--ink3)}
.search .input{padding-left:42px}
.flag{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface2);flex:none}

/* amount */
.pair{display:flex;align-items:center;gap:8px}
.acc-chip{flex:1;min-width:0;display:flex;gap:9px;align-items:center;padding:10px 11px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);color:inherit;text-align:left}
button.acc-chip{cursor:pointer}
.acc-chip b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-chip small{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.acc-chip span{min-width:0}
.pair-arrow{color:var(--ink3);flex:none}
.amt-big{text-align:center;font-size:54px;font-weight:700;letter-spacing:-.035em;margin-top:34px;font-variant-numeric:tabular-nums;min-height:64px;white-space:nowrap;overflow:hidden}
.amt-big.zero{color:var(--ink3)}
.amt-sub{text-align:center;font-size:13px;color:var(--ink2);margin-top:8px;min-height:40px;line-height:1.55;padding:0 10px}
.pcts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pcts button{height:42px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}

function qrSvg(seed){
  let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const N=25;let r='';
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" width="100%" height="100%" fill="#1a1611" shape-rendering="crispEdges">${r}${f(0,0)}${f(N-7,0)}${f(0,N-7)}</svg>`;
}

/* ---------- flows: fees & execution ---------- */
function feeOf(p,v){
  if(p.mode!=='send')return 0;
  if(p.kind==='bank')return RAIL_FEE[p.rail]||0;
  if(p.kind==='chain')return (NETS[p.from].find(n=>n.n===p.net)||{fee:1}).fee;
  return 0;
}
function recvOf(p,v){
  if(p.mode==='convert')return v-fxCalc(v).fee;
  if(p.mode==='send'&&p.kind==='bank')return v*RATES[p.ccy];
  return v;
}
const toCur=p=>p.mode==='send'?(p.kind==='bank'?p.ccy:ACC[p.from].cur):ACC[p.to].cur;
function etaOf(p){
  if(p.mode==='send'){if(p.kind==='bank')return RAIL_ETA[p.rail];if(p.kind==='chain')return '约 1–5 分钟';return '实时到账'}
  if(p.to==='EARN')return '实时，次日开始计息';
  if(p.from==='EARN')return '通常 1 个工作日内';
  return '实时到账';
}
function confirmRows(p){
  const fc=ACC[p.from].cur,tc=toCur(p),r=[];
  if(p.mode==='fixed'){const f=FT.find(x=>x.id===p.pid);return [['付款账户',ACC[p.from].name],['产品',`定期 ${f.days} 天`],['申购金额',money(p.amt,fc)],['参考年化',f.apy+'%'],['起息日',fmtD(TODAY)],['到期日',fmtD(addD(TODAY,f.days))],['预计到期收益','+'+money(ftInt(f,p.amt))],['到期处理','本息自动转入活期理财'],['提前赎回','不支持']]}
  r.push(['付款账户',ACC[p.from].name]);
  r.push(['收款方',p.mode==='send'?`${p.name}<br><small style="color:var(--ink3);font-weight:500">${p.sub}</small>`:ACC[p.to].name]);
  r.push(['金额',money(p.amt,fc)]);
  if(p.mode==='convert'){const x=fxCalc(p.amt);r.push(['汇率',S.fx.phase==='launch'?'1:1':'实时参考汇率（演示 1:1）']);
    if(x.mode==='fee'){r.push(['使用免费额度',money(x.free)]);if(x.charged)r.push(['兑换费 0.3%',money(x.fee)])}else r.push(['兑换费',x.mode==='vip'?'免费（交易达标）':'免费（上线期间）'])}
  else if(p.mode==='send'&&p.kind==='bank')FEE_ROWS(p.rail).forEach(x=>r.push(x));
  else r.push(['手续费',p.fee?money(p.fee,fc):'免费']);
  if(p.mode==='send'&&p.kind==='bank'&&p.ccy!=='USD')r.push(['汇率',`1 USD ≈ ${RATES[p.ccy]} ${p.ccy}`]);
  r.push([p.mode==='send'?(p.kind==='bank'&&p.rail==='SWIFT'?'对方到账（未扣中间行费用）':'对方到账'):'到账金额',money(recvOf(p,p.amt),tc)]);
  r.push(['预计到账',etaOf(p)]);
  return r;
}
function execute(p){
  const fc=ACC[p.from].cur,tc=toCur(p),recv=recvOf(p,p.amt);
  S.bal[p.from]=Math.round((S.bal[p.from]-p.amt-p.fee)*100)/100;
  const t={id:Date.now(),time:'刚刚',amt:-p.amt,cur:fc,recv,rows:confirmRows(p).filter(r=>r[0]!=='付款账户')};
  if(p.mode==='fixed'){const f=FT.find(x=>x.id===p.pid);S.fixed.push({id:t.id,pid:f.id,amt:p.amt,src:p.from,start:TODAY,end:addD(TODAY,f.days),int:r2(ftInt(f,p.amt))});
    Object.assign(t,{type:'swap',status:'计息中',icon:'lock',title:`申购定期 ${f.days} 天`,sub:`从${ACC[p.from].name} · 参考年化 ${f.apy}%`,earn:true,accs:[p.from,'EARN']});S.tx.unshift(t);refresh();return t}
  if(p.mode==='send'){Object.assign(t,{type:'out',icon:p.kind==='bank'?'bank':p.kind==='chain'?p.from:'at',title:'已发送',sub:`${p.name} · ${p.sub}`,status:p.kind==='inen'?'已完成':'处理中'})}
  else{
    S.bal[p.to]=Math.round((S.bal[p.to]+recv)*100)/100;
    Object.assign(t,{type:'swap',status:'已完成'});
    if(p.mode==='convert'){fxConsume(p.amt);}
    if(p.mode==='convert')Object.assign(t,{icon:'swap',title:`兑换 ${fc} → ${tc}`,sub:`到账 ${money(recv,tc)}`});
    else Object.assign(t,{icon:'move',title:`划转至${ACC[p.to].name}`,sub:`从${ACC[p.from].name}`,earn:p.from==='EARN'||p.to==='EARN',card:p.from==='CARD'||p.to==='CARD'});
  }
  if(p.mode==='transfer'&&p.to==='EARN')S.earnSrc[p.from]=r2(S.earnSrc[p.from]+p.amt);
  if(p.mode==='transfer'&&p.from==='EARN'){const sp=earnSplit(p.to,p.amt);S.earnSrc[p.to]=r2(S.earnSrc[p.to]-sp.free);let rest=sp.cross;
    const others=['USD','USDT','USDC'].filter(k=>k!==p.to&&S.earnSrc[k]>0);const tot=others.reduce((a,k)=>a+S.earnSrc[k],0);
    others.forEach((k,i)=>{const take=i===others.length-1?rest:r2(sp.cross*S.earnSrc[k]/tot);S.earnSrc[k]=Math.max(0,r2(S.earnSrc[k]-take));rest=r2(rest-take)})}
  t.accs=p.mode==='send'?[p.from]:[p.from,p.to];
  S.tx.unshift(t);refresh();return t;
}

function chartSvg(c,tf){
  const Q=q(c),conv=v=>PR[c].gram?v/31.1035:v+PR[c].off;let pts;
  if(tf==='1分')pts=T.series.map(conv);
  else{if(!T.charts[tf]){const n=70,vol={'15分':2.2,'1时':4.5,'日':14}[tf];let m=T.mid;const a=[];let seed=tf.length*97;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280};for(let i=0;i<n;i++){a.unshift(m);m-=(r()-.5)*vol*2+Math.sin(i/6)*vol*.3}T.charts[tf]=a}
    pts=T.charts[tf].slice(0,-1).concat([T.mid]).map(conv)}
  const W=340,H=170,mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  const xy=pts.map((v,i)=>[(i/(pts.length-1))*W,H-8-((v-mn)/rg)*(H-24)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const up=pts[pts.length-1]>=pts[0];const col=up?'var(--up)':'var(--down)';
  const last=xy[xy.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="${PR[c].name}走势">
    <defs><linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?'#6FCF97':'#E5796B'}" stop-opacity=".28"/><stop offset="1" stop-color="${up?'#6FCF97':'#E5796B'}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#cf)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
    <line x1="0" x2="${W}" y1="${last[1]}" y2="${last[1]}" stroke="${col}" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".6"/>
    <text x="4" y="14" font-size="10" fill="var(--ink3)">${fpx(mx)}</text><text x="4" y="${H-12}" font-size="10" fill="var(--ink3)">${fpx(mn)}</text></svg>`;
}

const nowT=()=>{const d=new Date();return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
function fillOrder(o,px){const pr=PR[o.code];const value=o.qty*pr.size*px;T.volume=(T.volume||0)+value;
  if(pr.type==='spot'){const fee=value*pr.feeRate;
    if(o.side==='buy'){T.hold[o.code]=+(T.hold[o.code]+o.qty).toFixed(3);T.cost[o.code]+=value+fee;S.bal.TRADE=r2(S.bal.TRADE-value-fee);T.fills.unshift({code:o.code,act:'买入',qty:o.qty,price:px,value,fee,time:nowT()})}
    else{const avg=T.cost[o.code]/T.hold[o.code];const pnl=value-fee-avg*o.qty;T.cost[o.code]-=avg*o.qty;T.hold[o.code]=+(T.hold[o.code]-o.qty).toFixed(3);if(T.hold[o.code]<=0){T.hold[o.code]=0;T.cost[o.code]=0}S.bal.TRADE=r2(S.bal.TRADE+value-fee);T.fills.unshift({code:o.code,act:'卖出',qty:o.qty,price:px,pnl,time:nowT()})}
  }else{const fee=pr.type==='fut'?pr.fee*o.qty:0;S.bal.TRADE=r2(S.bal.TRADE-fee);
    T.pos.push({id:Date.now()+Math.random(),code:o.code,side:o.side,qty:o.qty,open:px,sl:o.sl,tp:o.tp});

function tickPrices(){
  const prev=T.mid;T.mid=Math.round((T.mid+(Math.random()-.5)*1.1+(3652.4-T.mid)*0.01)*100)/100;
  T.hi=Math.max(T.hi,T.mid);T.lo=Math.min(T.lo,T.mid);T.series.push(T.mid);if(T.series.length>90)T.series.shift();
  let changed=false;
  T.orders=T.orders.filter(o=>{const Q=q(o.code);const hit=o.side==='buy'?Q.ask<=o.price:Q.bid>=o.price;if(hit){fillOrder(o,o.price);toast(PR[o.code].name+' 限价单已成交');changed=true}return !hit});
  T.pos.slice().forEach(p=>{const Q=q(p.code),px=p.side==='buy'?Q.bid:Q.ask;
    if(p.sl&&(p.side==='buy'?px<=p.sl:px>=p.sl)){closePos(p.id,'止损平仓');toast('触发止损，已平仓');changed=true}
    else if(p.tp&&(p.side==='buy'?px>=p.tp:px<=p.tp)){closePos(p.id,'止盈平仓');toast('触发止盈，已平仓');changed=true}});
  if(changed){refresh();return}
  const dir=T.mid>=prev?'fu':'fd';
  app.querySelectorAll('[data-px]').forEach(el=>{const Q=q(el.dataset.px);el.textContent=fpx(el.dataset.side?Q[el.dataset.side]:Q.mid);el.classList.remove('fu','fd');void el.offsetWidth;el.classList.add(dir)});
  app.querySelectorAll('[data-chg]').forEach(el=>{const Q=q(el.dataset.chg);el.textContent=fpct(Q.chg);el.classList.toggle('up',Q.chg>=0);el.classList.toggle('dn',Q.chg<0)});
  app.querySelectorAll('[data-pnl]').forEach(el=>{const p=T.pos.find(x=>String(x.id)===el.dataset.pnl);if(!p)return;const v=posPnl(p);el.textContent=(v>=0?'+':'−')+'$'+n2(Math.abs(v));el.classList.toggle('pos',v>=0);el.classList.toggle('neg',v<0)});
  app.querySelectorAll('[data-hpl]').forEach(el=>{const c=el.dataset.hpl;const v=T.hold[c]*q(c).bid-T.cost[c];el.textContent=(v>=0?'+':'−')+'$'+n2(Math.abs(v));el.classList.toggle('pos',v>=0);el.classList.toggle('neg',v<0)});
  const set=(sel,v)=>app.querySelectorAll(sel).forEach(el=>el.textContent=v);
  if(T.open){set('[data-eq]',money(tradeEquity()));set('[data-free]',money(tradeFree()));set('[data-used]',money(usedMargin()));
    const u=upnl();app.querySelectorAll('[data-upnl]').forEach(el=>{el.textContent=(u>=0?'+':'−')+'$'+n2(Math.abs(u));el.classList.toggle('pos',u>=0);el.classList.toggle('neg',u<0)})}
  stack.forEach(el=>el._tick&&el._tick());
}

const FX_FEE=0.003,VIP_VOL=500000,VOL_PER_QUOTA=10;   // $10 名义交易量 = $1 免费兑换额度
const fxVip=()=>(T.volume||0)>=VIP_VOL;
const fxBaseLeft=()=>Math.max(0,S.fx.base-S.fx.used);
const fxLeft=()=>fxBaseLeft()+S.fx.bonus;
function fxCalc(v){
  if(S.fx.phase==='launch')return {fee:0,free:v,charged:0,mode:'launch'};
  if(fxVip())return {fee:0,free:v,charged:0,mode:'vip'};
  const free=Math.min(v,fxLeft()),charged=r2(v-free);return {fee:r2(charged*FX_FEE),free,charged,mode:'fee'};
}
function fxConsume(v){if(S.fx.phase==='launch'||fxVip())return;const b=Math.min(v,fxBaseLeft());S.fx.used=r2(S.fx.used+b);const rest=r2(v-b);S.fx.bonus=Math.max(0,r2(S.fx.bonus-rest))}

  return Object.keys(g).sort().map(k=>`<div class="pl-l">${k}</div><div class="pl-g">${g[k].map(py=>`<button class="pl-i" data-py="${py.id}">${pAv(py)}<span class="pt"><b>${esc(py.name)}</b><small>${esc(pSub(py))}</small></span>${ic('chev',16,2.4)}</button>`).join('')}</div>`).join('');
}
SHEETS.payees=f=>{
  const list=S.payees.filter(p=>p.kind===f.kind&&(f.kind==='bank'?p.ccy===f.ccy:p.coin===f.coin));
  const title=f.kind==='bank'?`选择 ${f.ccy} 账户`:`选择 ${f.coin} 地址`;
  openSheet(title,list.length?payeeList(list):`<div class="empty">还没有${f.kind==='bank'?' '+f.ccy+' 常用收款账户':' '+f.coin+' 常用地址'}</div>`,e=>{
    const b=e.target.closest('[data-py]');if(!b)return;const py=S.payees.find(x=>x.id===+b.dataset.py);closeSheet(true);push('amount',pArg(py))},
    `<button class="sh-add" ${go('addPayee',f.kind==='bank'?{ccy:f.ccy}:{ccy:f.coin})}>添加</button>`);
};

  foot:`<button class="btn" id="next">添加</button>`,
  mount(el){let ptype='p';
    const codeL=(c,r)=>r==='SWIFT'?'SWIFT / BIC':c==='USD'?'ABA 路由号（9 位）':(LOCAL_CODE[c]||'银行代码');
    const draw=()=>{
      el.querySelectorAll('#pty button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===type));
      if(type==='chain'){const c=CRY.includes(p.ccy)?p.ccy:'USDT';
        el.querySelector('#pf').innerHTML=`<div class="field"><label for="pc">币种 <i class="req">*</i></label><select class="input" id="pc">${CRY.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="lbl" style="margin-top:6px">地址信息</div>
        <div class="field"><label for="nm">地址名称 <i class="req">*</i></label><input class="input" id="nm" placeholder="例如 Amelia Lee 的地址"></div>
        <div class="field"><label for="nt">转账网络 <i class="req">*</i></label><select class="input" id="nt"></select></div>
        <div class="field"><label for="ad">地址 <i class="req">*</i></label><div class="inwrap"><input class="input" id="ad" placeholder="输入或粘贴地址" autocomplete="off" style="padding-right:118px"><button class="inbtn" id="ps" style="right:52px;background:none;color:var(--gold)">粘贴</button><button class="inbtn" id="sc" aria-label="扫码" style="width:38px;padding:0">${ic('scan2',18,2)}</button></div></div>
        <div class="warnbox">${ic('info',18)}<span>请确认地址与网络匹配，转错网络的资产无法找回。</span></div>`;
        const nets=()=>{el.querySelector('#nt').innerHTML=NETS[V(el,'pc')].map(n=>`<option value="${n.n}">${n.n}（${n.s}）</option>`).join('')};
        el.querySelector('#pc').onchange=nets;nets();
        el.querySelector('#ps').onclick=()=>{const n=V(el,'nt');el.querySelector('#ad').value=n==='TRON'?'TMsn34dfeEMWSDEskdf223sesQ9xLp2Vb':n==='Solana'?'8FpR3kLmN2vQ7wX9yT4bC6dE1hJ5aS0uGiZ':'0x5b2E9a1C7d4F8e3B6a0D2c9E7f1A4b8C6d3e21';el.dispatchEvent(new Event('input'))};
        el.querySelector('#sc').onclick=()=>toast('正在打开相机扫码…');
      }else{const c=p.ccy&&!CRY.includes(p.ccy)?p.ccy:'USD';
        el.querySelector('#pf').innerHTML=`<div class="field"><label for="pc">收款币种 <i class="req">*</i></label><select class="input" id="pc">${CCYS.map(x=>`<option value="${x[0]}" ${x[0]===c?'selected':''}>${x[2]} ${x[1]} ${x[0]}</option>`).join('')}</select></div>
        <div class="lbl" style="margin-top:6px">收款人信息</div>
        <div class="field"><label>收款人类型</label><div class="seg" id="pt2"><button data-v="p" aria-pressed="${ptype==='p'}">个人</button><button data-v="b" aria-pressed="${ptype==='b'}">企业</button></div></div>
        <div class="field"><label for="nm">${ptype==='p'?'收款人姓名（与银行账户一致）':'企业全称'} <i class="req">*</i></label><input class="input" id="nm" placeholder="${ptype==='p'?'例如 LI MING / 张志强':'与银行账户一致'}"></div>
        <div class="lbl" style="margin-top:6px">银行信息</div>
        <div class="field"><label for="rl">汇款通道</label><select class="input" id="rl"></select></div>
        <div class="field"><label for="cd" id="cdl"></label><input class="input" id="cd" autocomplete="off"></div>
        <div class="field"><label for="bk">银行名称 <i class="req">*</i></label><input class="input" id="bk" placeholder="例如 中国建设银行"></div>
        <div class="field"><label for="ac" id="acl"></label><input class="input" id="ac" inputmode="numeric"></div>`;
        const upd=()=>{const cc=V(el,'pc');const rails=cc==='USD'?['ACH','Wire','SWIFT']:['本地清算','SWIFT'];const cur=V(el,'rl');
          el.querySelector('#rl').innerHTML=rails.map(r=>`<option ${r===cur?'selected':''}>${r}</option>`).join('');
          el.querySelector('#cdl').innerHTML=codeL(cc,V(el,'rl'))+' <i class="req">*</i>';

        el.querySelector('#pc').onchange=upd;el.querySelector('#rl').onchange=upd;upd();

      }};
    el.querySelector('#pty').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;type=b.dataset.v;draw()};
    draw();
    formMount(el,()=>type==='chain'?V(el,'nm')&&V(el,'ad').length>=20:V(el,'nm')&&V(el,'cd')&&V(el,'bk')&&V(el,'ac').length>=4,()=>{
      const nm=type==='bank'?V(el,'nm').replace(/^[a-z ]+$/i,m=>m.toUpperCase()):V(el,'nm');
      const py=type==='chain'?{kind:'chain',coin:V(el,'pc'),net:V(el,'nt'),addr:V(el,'ad').slice(0,6)+'…'+V(el,'ad').slice(-4)}
        :{kind:'bank',ccy:V(el,'pc'),bank:V(el,'bk'),acct:V(el,'ac').slice(-4),rail:V(el,'rl')};
      S.payees.push(Object.assign(py,{id:Date.now(),name:nm,init:pInit(nm)}));toast('已添加常用联系人');pop();
      setTimeout(()=>{stack.forEach(x=>x._draw&&x._draw());refresh()},350)});
  }};
};

/* ---------- internal transfer (new layout) ---------- */
const ACC_NO=()=>({USD:S.kyc>=2?'8130 **** 3926':'未开通',CARD:'4867 **** 8507',EARN:'活期理财 · 随时转出',TRADE:T.open?'1000 2020 33':'未开通'});
P.transfer=(p)=>({title:'划转',body:`<div id="xb"></div>`,
  foot:`<div class="xf-sum" id="xs"></div><button class="btn gold" id="go" disabled>立即划转</button>`,
  mount(el){
    let amt='';
    const eta=()=>p.to==='EARN'?'实时到账，次日计息':p.from==='EARN'?'通常 1 个工作日内':'实时到账';
    const draw=()=>{const av=availOf(p.from),no=ACC_NO();
      el.querySelector('#xb').innerHTML=`
      <div class="xf-card">
        <div class="xf-rows">
          <button class="xf-row" data-pick="from"><span class="xf-dot on"></span><span class="xf-l">从</span><span class="xf-a"><b>${ACC[p.from].name}</b><small>${no[p.from]}</small></span>${ic('chev',16,2.4)}</button>
          <div class="xf-sep"></div>
          <button class="xf-row" data-pick="to"><span class="xf-dot"></span><span class="xf-l">到</span><span class="xf-a"><b>${ACC[p.to].name}</b><small>${no[p.to]}</small></span>${ic('chev',16,2.4)}</button>
        </div>
        <button class="xf-swap" id="sw" aria-label="交换">${ic('updown',20,2.2)}</button>
      </div>
      <div class="xf-amt"><b>划转金额</b>
        <div class="xf-in"><input id="xa" inputmode="decimal" placeholder="0.00" value="${amt}" aria-label="划转金额"><span>USD</span></div>
        <div class="xf-av"><span>可用：${n2(av)} USD</span><button id="all">全部</button></div>
        <div id="xe"></div></div>`;
      bind();calc()};
    const calc=()=>{const v=parseFloat(amt)||0,av=availOf(p.from);let err='';
      if(p.to==='TRADE'&&!T.open)err=`请先<button class="linkbtn" ${go('tradeOpen')}>开通交易账户</button>`;
      else if(v>av+1e-9)err='可用余额不足';
      el.querySelector('#xe').innerHTML=err?`<p class="xf-err">${err}</p>`:'';
      el.querySelector('#xs').innerHTML=`<div><span>手续费</span><b>0.00 USD</b></div><div><span>到账时间</span><b>${eta()}</b></div><div><span>预计到账数量</span><b>${v>0?n2(v)+' USD':'--'}</b></div>`;
      el.querySelector('#go').disabled=!(v>0)||!!err};
    const bind=()=>{
      const xa=el.querySelector('#xa');xa.oninput=()=>{let v=xa.value.replace(/[^\d.]/g,'');const pp=v.split('.');if(pp.length>2)v=pp[0]+'.'+pp.slice(1).join('');if(pp[1]&&pp[1].length>2)v=pp[0]+'.'+pp[1].slice(0,2);xa.value=v;amt=v;calc()};
      el.querySelector('#all').onclick=()=>{amt=String(Math.floor(availOf(p.from)*100)/100);draw()};
      el.querySelector('#sw').onclick=()=>{if(!XFER[p.to].includes(p.from)){toast('该方向暂不支持划转');return}[p.from,p.to]=[p.to,p.from];amt='';draw()};
      el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const side=b.dataset.pick;
        const opts=side==='to'?XFER[p.from]:['USD','CARD','EARN','TRADE'].filter(k=>k!==p.to);
        openSheet(side==='from'?'从哪个账户':'转入哪个账户',`<div class="group" style="margin-top:8px">${opts.map(k=>item({iconHtml:coin(k,40),title:ACC[k].name,sub:ACC_NO()[k]+' · 可用 '+money(availOf(k)),right:p[side]===k?ic('check',18,2.6):'',attrs:`data-acc="${k}"`})).join('')}</div>
          <p class="note">划转只在美元计价的账户之间进行：虚拟卡、理财、交易账户都只与美元账户互转。</p>`,ev=>{
          const x=ev.target.closest('[data-acc]');if(!x)return;p[side]=x.dataset.acc;
          if(!XFER[p.from].includes(p.to))p.to=XFER[p.from][0];closeSheet();amt='';draw()})});
    };
    el._draw=draw;
    el.querySelector('#go').onclick=()=>{const v=parseFloat(amt)||0;if(!(v>0))return;
      const q={mode:'transfer',from:p.from,to:p.to,amt:v,fee:0};execute(q);
      const sh=openSheet('',`<div class="xf-ok"><div class="xf-okc">${ic('check',34,3)}</div><h2>划转成功</h2></div>
        <div class="group" style="margin-top:6px"><div class="kv"><span>划转金额</span><b>${n2(v)} USD</b></div><div class="kv"><span>转出账户</span><b>${ACC[q.from].name}（${ACC_NO()[q.from].slice(-4)}）</b></div><div class="kv"><span>转入账户</span><b>${ACC[q.to].name}</b></div><div class="kv"><span>到账时间</span><b>${eta()}</b></div></div>
        <div class="btns" style="margin-top:20px"><button class="btn ghost" data-act="goHome">回到首页</button><button class="btn gold" data-again>继续划转</button></div>`,ev=>{
          if(ev.target.closest('[data-again]')){closeSheet();amt='';draw()}});
    };
    draw();
  }});


function lvCard(){
  const L=[['L0','注册'],['L1','身份认证'],['L2','美元账户']];
  const name=S.kyc>=2?'美元账户已开通':S.kycPending?'身份已认证 · 美元账户审核中':S.kyc===1?'身份已认证':'已注册，未认证';
  const u=S.kyc>=2?'已解锁全部功能：美元账户、虚拟卡、理财、交易与提现'
    :S.kyc===1?`已解锁稳定币充值与兑换（累计 ${L1_LIMIT.toLocaleString()} USDT / USDC）`
    :'仅可浏览，完成身份认证后解锁稳定币充值与兑换';
  const cta=S.kyc>=2?'':S.kycPending?'查看审核进度':S.kyc===1?'开通美元账户':'开始身份认证';
  return `<div class="lvcard" ${go(S.kyc>=2?'kyc':S.kycPending?'kyc2Status':'kycIntro')}>
    <div class="lvc-top"><div><small>认证等级</small><b>${name}</b></div><span class="lvc-badge">L${S.kyc}</span></div>
    <div class="lvc-steps">${L.map((x,i)=>`<div class="${i<=S.kyc?'on':''}${i===S.kyc+1&&S.kycPending?' pend':''}"><i></i><span>${x[0]} ${x[1]}</span></div>`).join('')}</div>
    <p class="lvc-u">${u}</p>${cta?`<span class="lvc-cta">${cta} ${ic('chev',14,2.6)}</span>`:''}</div>`;
}

P.convert=(p)=>({title:'兑换',right:`<button class="round" ${go('fxRules')} aria-label="兑换规则">${ic('info',20,2)}</button>`,
  body:`<div id="cvb"></div>`,
  foot:`<button class="btn" id="go" disabled>继续</button>
   <div class="keypad cv-kp">${['1','2','3','4','5','6','7','8','9','.','0','del'].map(k=>`<button class="key" data-k="${k}" aria-label="${k==='del'?'删除':k}">${k==='del'?ic('del',24,1.8):k}</button>`).join('')}</div>`,
  mount(el){
    let a='',side='from';
    const recvOf2=v=>v-fxCalc(v).fee;
    const fromFor=t=>{if(!(t>0))return 0;const x=fxCalc(t);if(x.mode!=='fee')return t;const L=fxLeft();return t<=L?t:Math.ceil(((t-L*FX_FEE)/(1-FX_FEE))*100)/100};
    const vals=()=>{const n=parseFloat(a)||0;return side==='from'?[n,recvOf2(n)]:[fromFor(n),n]};
    const fmtA=(v,active)=>active?(a||'0'):(v?n2(v):'0');
    const draw=()=>{const [fv,tv]=vals(),bal=S.bal[p.from],over=fv>bal+1e-9,x=fxCalc(fv);
      const feeTxt=x.mode==='launch'?'上线期间免手续费':x.mode==='vip'?'交易达标，本月免手续费':x.charged?`超出免费额度 ${money(x.charged)}，收取 0.3%`:`使用本月免费额度 · 剩余 ${money(fxLeft())}`;
      el.querySelector('#cvb').innerHTML=`
      <div class="cv-card">
        <div class="cv-row"><button class="cv-chip" data-cpick="from">${coin(p.from,30)}<b>${p.from}</b>${ic('chev',16,2.4)}</button>
          <button class="cv-amt ${side==='from'?'on':''} ${!fv&&side==='from'&&!a?'zero':''}" data-side="from">${fmtA(fv,side==='from')}${side==='from'?'<i class="caret"></i>':''}</button></div>
        <div class="cv-bal">余额 ${money(bal,ACC[p.from].cur)}</div>
        <div class="cv-mid"><button class="cv-swap" id="swp" aria-label="交换币种">${ic('updown',20,2.2)}</button></div>
        <div class="cv-row"><button class="cv-chip" data-cpick="to">${coin(p.to,30)}<b>${p.to}</b>${ic('chev',16,2.4)}</button>
          <button class="cv-amt ${side==='to'?'on':''} ${!tv&&!(side==='to'&&a)?'zero':''}" data-side="to">${fmtA(tv,side==='to')}${side==='to'?'<i class="caret"></i>':''}</button></div>
        <div class="cv-bal">余额 ${money(S.bal[p.to],ACC[p.to].cur)}</div>
      </div>
      ${over?`<div class="cv-warn">${ic('info',18,2.2)}<span>你的可用余额仅 <u>${money(bal,ACC[p.from].cur)}</u></span></div>`:''}
      <div class="cv-rate">1 ${p.from} ≈ 1 ${p.to}${S.fx.phase==='launch'?'<span class="pill ok" style="margin-left:8px">1:1</span>':''}</div>
      <button class="cv-fee" ${go('fxRules')}><span class="cv-fi">${ic('doc',20,1.9)}</span><span class="cv-ft"><small>兑换费</small><b>${feeTxt}</b></span><span class="cv-fv">${n2(x.fee)} ${ACC[p.from].cur==='USD'?'USD':p.from}</span>${ic('chev',16,2.4)}</button>`;
      el.querySelector('#go').disabled=!(fv>0)||over;
    };
    el._draw=draw;
    el.addEventListener('click',e=>{
      const k=e.target.closest('[data-k]');
      if(k){const v=k.dataset.k;if(v==='del')a=a.slice(0,-1);else if(v==='.'){if(!a.includes('.'))a=(a||'0')+'.'}else{const d=a.split('.')[1];if(d!==undefined&&d.length>=2)return;if(a.replace('.','').length>=9)return;a=a==='0'?v:a+v}draw();return}
      const sd=e.target.closest('[data-side]');if(sd&&sd.dataset.side!==side){const [fv,tv]=vals();side=sd.dataset.side;const cur=side==='from'?fv:tv;a=cur?String(Math.round(cur*100)/100):'';draw();return}
      if(e.target.closest('#swp')){[p.from,p.to]=[p.to,p.from];side=side==='from'?'to':'from';draw();return}
      const cp=e.target.closest('[data-cpick]');
      if(cp){const s=cp.dataset.cpick,other=s==='from'?p.to:p.from;
        openSheet(s==='from'?'选择卖出币种':'选择买入币种',`<div class="group" style="margin-top:8px">${['USD','USDT','USDC'].map(k=>item({iconHtml:coin(k,40),title:k==='USD'?'美元 USD':k,sub:'余额 '+money(S.bal[k],ACC[k].cur),right:p[s]===k?ic('check',18,2.6):'',attrs:`data-cc2="${k}"`})).join('')}</div><p class="note">兑换仅支持美元、USDT、USDC 之间互换。</p>`,ev=>{
          const b=ev.target.closest('[data-cc2]');if(!b)return;const k=b.dataset.cc2;if(k===other){[p.from,p.to]=[p.to,p.from]}else p[s]=k;closeSheet();draw()})}
    });
    el.querySelector('#go').onclick=()=>{const [fv]=vals();if(!(fv>0))return;push('confirm',Object.assign({},p,{amt:Math.round(fv*100)/100,fee:0}))};
    draw();
  }});

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-tab],[data-sheet],[data-act],[data-copy],[data-tx],[data-sw],[data-filter],[data-ttab],[data-pos],[data-fx],[data-sim],[data-simrate],[data-simtf]');
  if(!el||!app.contains(el))return;
  if(el.dataset.sw!==undefined&&el.matches('.switch')){const k=el.dataset.sw;S.sw[k]=!S.sw[k];el.setAttribute('aria-checked',S.sw[k]);if(k==='twofa'){refresh();toast(S.sw.twofa?'双重验证已开启':'双重验证已关闭')}e.stopPropagation();return}
  if(el.dataset.copy){copy(el.dataset.copy);return}
  if(el.dataset.act){e.stopPropagation();ACT[el.dataset.act]&&ACT[el.dataset.act](el);return}
  if(el.dataset.go){push(el.dataset.go,el.dataset.arg?JSON.parse(el.dataset.arg):{});return}
  if(el.dataset.tx){push('txDetail',{id:+el.dataset.tx});return}
  if(el.dataset.tab){closeSheet(true);popAll();setTab(el.dataset.tab);return}
  if(el.dataset.sheet){if(el.dataset.sheet==='cardNo'&&S.kyc<2){gateSheet(2);return}SHEETS[el.dataset.sheet]();return}
  if(el.dataset.filter){S.txFilter=el.dataset.filter;refresh();return}
  if(el.dataset.ttab){T.tab=el.dataset.ttab;refresh();return}
  if(el.dataset.fx){SHEETS.fixed(Number(el.dataset.fx));return}
  if(el.dataset.sim){const L=[1000,5000,10000,50000,100000,500000];let i=L.indexOf(S.sim.amt);i=Math.max(0,Math.min(L.length-1,i+(el.dataset.sim==='+'?1:-1)));S.sim.amt=L[i];refresh();return}
  if(el.dataset.simrate){S.sim.rate=el.dataset.simrate;refresh();return}
  if(el.dataset.simtf){S.sim.tf=el.dataset.simtf;refresh();return}
  if(el.dataset.pos){SHEETS.pos(Number(el.dataset.pos));return}
});
app.addEventListener('scroll',e=>{if(e.target.id==='v-earn'){const c=$('#ecmp');c&&c.classList.toggle('show',e.target.scrollTop>150)}},true);
app.addEventListener('input',e=>{
  if(e.target.matches('[data-calc]')){S.calc=+e.target.value;$('#calcA').textContent='$'+n2(S.calc);$('#calcE').textContent='≈ $'+n2(S.calc*0.0675)}
});

/* ---------- theme ---------- */
function setTheme(t){app.dataset.theme=t;document.documentElement.dataset.theme=t;
  document.querySelectorAll('.seg-mini button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));
  try{localStorage.setItem('inen-theme',t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem('inen-theme')}catch(e){}
setTheme(saved||'dark');
document.querySelectorAll('.seg-mini button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));

refresh();
document.getElementById('obStart').onclick=startOnboarding;
})();
</script>
